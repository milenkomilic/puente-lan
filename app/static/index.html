<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Puente</title>
<script>
  /* Se aplica el tema ANTES de pintar para que no haya un destello de color
     equivocado al cargar. "auto" deja mandar a la preferencia del sistema. */
  try { document.documentElement.setAttribute("data-theme", localStorage.getItem("puente-theme") || "auto"); }
  catch (e) { document.documentElement.setAttribute("data-theme", "auto"); }
</script>
<style>
  /* ══════════════════════════════════════════════════════
     TOKENS — tema claro (por defecto)
     Paleta cálida tipo papel + acento terracota.
     Todo el resto del CSS usa variables: para cambiar la
     identidad visual no hay que tocar nada más que esto.
     ══════════════════════════════════════════════════════ */
  :root {
    --bg:            #faf9f5;
    --bg-side:       #f2f0e8;
    --surface:       #ffffff;
    --surface-2:     #f6f4ed;
    --hover:         #eceadf;
    --hover-strong:  #e3e0d3;
    --input:         #ffffff;
    --border:        #e2ddd0;
    --border-soft:   #ebe7db;
    --text:          #1f1e1d;
    --text-dim:      #6d695e;
    --text-faint:    #979286;

    --accent:        #c0603d;
    --accent-hover:  #a95232;
    --accent-fg:     #ffffff;
    --accent-soft:   rgba(192,96,61,.10);
    --accent-line:   rgba(192,96,61,.30);

    --danger:        #b0453a;
    --danger-fg:     #ffffff;
    --danger-soft:   rgba(176,69,58,.10);
    --danger-line:   rgba(176,69,58,.32);
    --ok:            #3d7a51;
    --ok-soft:       rgba(61,122,81,.12);
    --warn:          #96661c;
    --warn-soft:     rgba(150,102,28,.13);

    --ring:          rgba(192,96,61,.26);
    --scrim:         rgba(41,37,31,.36);

    --shadow-xs: 0 1px 2px rgba(41,37,31,.06);
    --shadow-sm: 0 2px 6px rgba(41,37,31,.07), 0 1px 2px rgba(41,37,31,.05);
    --shadow-md: 0 10px 28px rgba(41,37,31,.10), 0 2px 6px rgba(41,37,31,.06);
    --shadow-lg: 0 28px 70px rgba(41,37,31,.20), 0 6px 20px rgba(41,37,31,.10);

    --r-xs: 6px; --r-sm: 9px; --r-md: 13px; --r-lg: 18px; --r-xl: 24px;

    --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter,
            Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino,
                  Georgia, "Times New Roman", serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas,
                 "Liberation Mono", monospace;

    --ease: cubic-bezier(.32,.72,0,1);
  }

  /* ── tema oscuro: por sistema, salvo que se haya forzado "light" ── */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:            #262624;
      --bg-side:       #1f1e1d;
      --surface:       #30302e;
      --surface-2:     #2a2a28;
      --hover:         #3a3a37;
      --hover-strong:  #454541;
      --input:         #1f1e1d;
      --border:        #403f3b;
      --border-soft:   #35342f;
      --text:          #f3f1e9;
      --text-dim:      #a8a49a;
      --text-faint:    #7c786f;

      --accent:        #d97757;
      --accent-hover:  #e5896a;
      --accent-fg:     #241008;
      --accent-soft:   rgba(217,119,87,.15);
      --accent-line:   rgba(217,119,87,.38);

      --danger:        #e2695c;
      --danger-fg:     #2a0c08;
      --danger-soft:   rgba(226,105,92,.13);
      --danger-line:   rgba(226,105,92,.36);
      --ok:            #6fc086;
      --ok-soft:       rgba(111,192,134,.13);
      --warn:          #d9a441;
      --warn-soft:     rgba(217,164,65,.13);

      --ring:          rgba(217,119,87,.32);
      --scrim:         rgba(8,8,7,.62);

      --shadow-xs: 0 1px 2px rgba(0,0,0,.30);
      --shadow-sm: 0 2px 6px rgba(0,0,0,.34), 0 1px 2px rgba(0,0,0,.26);
      --shadow-md: 0 10px 28px rgba(0,0,0,.42), 0 2px 6px rgba(0,0,0,.30);
      --shadow-lg: 0 28px 70px rgba(0,0,0,.55), 0 6px 20px rgba(0,0,0,.38);
    }
  }
  /* ── tema oscuro forzado a mano ── */
  :root[data-theme="dark"] {
    --bg:            #262624;
    --bg-side:       #1f1e1d;
    --surface:       #30302e;
    --surface-2:     #2a2a28;
    --hover:         #3a3a37;
    --hover-strong:  #454541;
    --input:         #1f1e1d;
    --border:        #403f3b;
    --border-soft:   #35342f;
    --text:          #f3f1e9;
    --text-dim:      #a8a49a;
    --text-faint:    #7c786f;

    --accent:        #d97757;
    --accent-hover:  #e5896a;
    --accent-fg:     #241008;
    --accent-soft:   rgba(217,119,87,.15);
    --accent-line:   rgba(217,119,87,.38);

    --danger:        #e2695c;
    --danger-fg:     #2a0c08;
    --danger-soft:   rgba(226,105,92,.13);
    --danger-line:   rgba(226,105,92,.36);
    --ok:            #6fc086;
    --ok-soft:       rgba(111,192,134,.13);
    --warn:          #d9a441;
    --warn-soft:     rgba(217,164,65,.13);

    --ring:          rgba(217,119,87,.32);
    --scrim:         rgba(8,8,7,.62);

    --shadow-xs: 0 1px 2px rgba(0,0,0,.30);
    --shadow-sm: 0 2px 6px rgba(0,0,0,.34), 0 1px 2px rgba(0,0,0,.26);
    --shadow-md: 0 10px 28px rgba(0,0,0,.42), 0 2px 6px rgba(0,0,0,.30);
    --shadow-lg: 0 28px 70px rgba(0,0,0,.55), 0 6px 20px rgba(0,0,0,.38);
  }

  /* ══════════════════════════════════════════════════════
     BASE
     ══════════════════════════════════════════════════════ */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex; font-family: var(--font);
    background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    transition: background .2s var(--ease), color .2s var(--ease);
  }
  button, input, select, textarea { font-family: inherit; font-size: 13.5px; color: inherit; }
  a { color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); background-clip: content-box; }

  @keyframes fade-in   { from { opacity: 0 } to { opacity: 1 } }
  @keyframes fade-out  { from { opacity: 1 } to { opacity: 0 } }
  @keyframes pop-in    { from { opacity: 0; transform: translateY(14px) scale(.975) } to { opacity: 1; transform: none } }
  @keyframes pop-out   { from { opacity: 1; transform: none } to { opacity: 0; transform: translateY(6px) scale(.985) } }
  @keyframes slide-in  { from { opacity: 0; transform: translateX(22px) scale(.97) } to { opacity: 1; transform: none } }
  @keyframes slide-out { from { opacity: 1; transform: none } to { opacity: 0; transform: translateX(22px) scale(.97) } }
  @keyframes msg-in    { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  @keyframes shimmer   { from { background-position: -420px 0 } to { background-position: 420px 0 } }
  @keyframes spin      { to { transform: rotate(360deg) } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important;
                             transition-duration: .01ms !important; }
  }

  /* ══════════════════════════════════════════════════════
     LAYOUT
     ══════════════════════════════════════════════════════ */
  #app { flex: 1; display: flex; min-width: 0; }

  #side {
    width: 272px; flex-shrink: 0; display: flex; flex-direction: column;
    background: var(--bg-side); border-right: 1px solid var(--border-soft);
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; }
  .brand .mark {
    width: 30px; height: 30px; flex-shrink: 0; border-radius: 9px;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .brand .mark svg { width: 19px; height: 19px; }
  .brand .name { font-size: 15px; font-weight: 600; letter-spacing: -.012em; font-family: var(--font-serif); }
  .brand .spacer { flex: 1; }

  #bridges { flex: 1; overflow-y: auto; padding: 2px 8px 8px; }
  .sec-label {
    font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase;
    color: var(--text-faint); padding: 10px 11px 6px;
  }
  .bridge {
    padding: 8px 10px; cursor: pointer; border-radius: var(--r-sm);
    display: flex; align-items: center; gap: 9px; margin-bottom: 1px;
    color: var(--text-dim); position: relative;
    transition: background .13s var(--ease), color .13s var(--ease);
  }
  .bridge .dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
    background: var(--text-faint); opacity: .4; transition: all .18s var(--ease);
  }
  .bridge .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bridge:hover { background: var(--hover); color: var(--text); }
  .bridge:active { transform: scale(.985); }
  .bridge.active { background: var(--accent-soft); color: var(--text); font-weight: 500; }
  .bridge.active .dot { background: var(--accent); opacity: 1; box-shadow: 0 0 0 3px var(--accent-soft); }
  .bridge .gear {
    opacity: 0; color: var(--text-faint); flex-shrink: 0; width: 24px; height: 24px;
    border: 0; background: none; border-radius: var(--r-xs); cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    transition: opacity .13s var(--ease), background .13s var(--ease), color .13s var(--ease);
  }
  .bridge:hover .gear, .bridge.active .gear, .bridge .gear:focus-visible { opacity: 1; }
  .bridge .gear:hover { background: var(--hover-strong); color: var(--text); }
  .bridge .gear svg { width: 15px; height: 15px; }

  #sidefoot { padding: 8px; border-top: 1px solid var(--border-soft); display: flex; flex-direction: column; gap: 2px; }
  .sidebtn {
    padding: 9px 11px; background: transparent; color: var(--text-dim); text-align: left;
    border: 0; border-radius: var(--r-sm); cursor: pointer; font-weight: 400;
    display: flex; align-items: center; gap: 10px;
    transition: background .13s var(--ease), color .13s var(--ease);
  }
  .sidebtn svg { width: 16px; height: 16px; flex-shrink: 0; opacity: .85; }
  .sidebtn:hover { background: var(--hover); color: var(--text); }
  .sidebtn:active { transform: scale(.985); }
  .sidebtn.primary {
    background: var(--accent); color: var(--accent-fg); font-weight: 500;
    box-shadow: var(--shadow-xs); margin-bottom: 4px;
  }
  .sidebtn.primary:hover { background: var(--accent-hover); color: var(--accent-fg); }

  .whoami {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; margin-top: 4px;
    border-top: 1px solid var(--border-soft); padding-top: 12px;
  }
  .avatar {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0;
    background: var(--accent); color: var(--accent-fg);
    display: flex; align-items: center; justify-content: center;
    font-size: 12.5px; font-weight: 600; text-transform: uppercase;
  }
  .whoami .t { flex: 1; min-width: 0; }
  .whoami .t b { display: block; font-size: 13px; font-weight: 600; overflow: hidden;
                 text-overflow: ellipsis; white-space: nowrap; }
  .whoami .t span { display: block; font-size: 11.5px; color: var(--text-faint); }

  /* ── panel principal ── */
  #main { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; background: var(--bg); }
  #head {
    padding: 0 24px; height: 58px; flex-shrink: 0; display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--border-soft); font-weight: 600; font-size: 15px;
    letter-spacing: -.012em; background: var(--bg);
  }
  #head.placeholder { color: var(--text-faint); font-weight: 400; }

  #log { flex: 1; overflow-y: auto; padding: 24px 24px 8px; scroll-behavior: smooth; }
  .msg { margin-bottom: 16px; max-width: min(70%, 620px); animation: msg-in .22s var(--ease) both; }
  .msg.mine { margin-left: auto; }
  .meta { font-size: 11.5px; color: var(--text-faint); margin-bottom: 5px; padding: 0 4px; }
  .msg.mine .meta { text-align: right; }
  .body {
    background: var(--surface); border: 1px solid var(--border-soft);
    padding: 10px 14px; border-radius: 16px 16px 16px 5px;
    display: inline-block; white-space: pre-wrap; overflow-wrap: anywhere;
    line-height: 1.55; box-shadow: var(--shadow-xs);
    transition: box-shadow .16s var(--ease);
  }
  .body:hover { box-shadow: var(--shadow-sm); }
  .msg.mine .body {
    background: var(--accent); color: var(--accent-fg); border-color: transparent;
    border-radius: 16px 16px 5px 16px;
  }
  .file { display: flex; align-items: center; gap: 11px; text-decoration: none; color: inherit; }
  .file .ic {
    width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    transition: transform .16s var(--ease);
  }
  .file .ic svg { width: 16px; height: 16px; }
  .msg.mine .file .ic { background: rgba(255,255,255,.22); color: var(--accent-fg); }
  .file:hover .ic { transform: translateY(2px); }
  .file .fn { font-weight: 500; overflow-wrap: anywhere; }
  .file .sz { font-size: 11.5px; color: var(--text-dim); }
  .msg.mine .file .sz { color: var(--accent-fg); opacity: .78; }

  #bar { padding: 8px 24px 20px; flex-shrink: 0; }
  #composer {
    display: flex; gap: 6px; align-items: center; background: var(--input);
    border: 1px solid var(--border); border-radius: var(--r-xl);
    padding: 6px 6px 6px 8px; box-shadow: var(--shadow-xs);
    transition: border-color .16s var(--ease), box-shadow .16s var(--ease);
  }
  #composer:focus-within { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--ring); }
  #input { flex: 1; padding: 9px 2px; background: transparent; border: 0; outline: none;
           color: var(--text); font-size: 14.5px; }
  #input::placeholder { color: var(--text-faint); }
  .iconbtn {
    background: none; border: 0; color: var(--text-dim); cursor: pointer; padding: 0;
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background .13s var(--ease), color .13s var(--ease), transform .13s var(--ease);
  }
  .iconbtn svg { width: 18px; height: 18px; }
  .iconbtn:hover { background: var(--hover); color: var(--text); }
  .iconbtn:active { transform: scale(.92); }
  .iconbtn:disabled { opacity: .35; cursor: default; }
  .iconbtn:disabled:hover { background: none; color: var(--text-dim); }
  #send { background: var(--accent); color: var(--accent-fg); }
  #send:hover { background: var(--accent-hover); color: var(--accent-fg); }
  #send:disabled { background: var(--hover); color: var(--text-faint); }
  #send:disabled:hover { background: var(--hover); }

  #drop {
    position: absolute; inset: 10px; background: var(--accent-soft);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    border: 2px dashed var(--accent); border-radius: var(--r-lg);
    display: none; align-items: center; justify-content: center; pointer-events: none;
    z-index: 5; font-weight: 500; color: var(--accent); flex-direction: column; gap: 10px;
  }
  #drop.on { display: flex; animation: fade-in .14s var(--ease); }
  #drop svg { width: 30px; height: 30px; }

  #prog { height: 2px; background: var(--accent); width: 0; transition: width .18s var(--ease);
          border-radius: 2px; margin: 0 24px; }
  .err { color: var(--danger); font-size: 12.5px; padding: 6px 24px 0; min-height: 0; }

  /* ══════════════════════════════════════════════════════
     GATE (pantallas previas al inicio de sesión)
     ══════════════════════════════════════════════════════ */
  #gate-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
  #gate {
    width: 100%; max-width: 400px; background: var(--surface);
    border: 1px solid var(--border-soft); border-radius: var(--r-xl);
    padding: 34px 32px 30px; box-shadow: var(--shadow-md); text-align: center;
    animation: pop-in .3s var(--ease) both;
  }
  #gate .mark {
    width: 46px; height: 46px; border-radius: 14px; margin: 0 auto 16px;
    background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  #gate .mark svg { width: 26px; height: 26px; }
  #gate h2 { margin: 0 0 8px; font-size: 21px; font-weight: 600; letter-spacing: -.02em;
             font-family: var(--font-serif); line-height: 1.25; }
  #gate .sub { color: var(--text-dim); font-size: 14px; line-height: 1.55; margin-bottom: 22px; }
  #gate .txt { width: 100%; margin-bottom: 14px; padding: 12px 14px; font-size: 15px; text-align: center; }
  #gate .actions { display: flex; flex-direction: column; gap: 8px; }
  #gate .actions.row { flex-direction: row; }
  #gate .actions.row .btn { flex: 1; justify-content: center; }
  #gate .actions .btn { padding: 11px 16px; font-size: 14.5px; justify-content: center; }
  #gate .note {
    margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border-soft);
    font-size: 12.5px; color: var(--text-dim); line-height: 1.55; text-align: left;
  }

  /* ══════════════════════════════════════════════════════
     BOTONES Y CAMPOS
     ══════════════════════════════════════════════════════ */
  .btn {
    display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
    background: var(--surface); border: 1px solid var(--border); color: var(--text-dim);
    padding: 7px 13px; border-radius: var(--r-sm); cursor: pointer; text-decoration: none;
    font-weight: 500; box-shadow: var(--shadow-xs);
    transition: background .13s var(--ease), border-color .13s var(--ease),
                color .13s var(--ease), transform .1s var(--ease), box-shadow .13s var(--ease);
  }
  .btn svg { width: 15px; height: 15px; flex-shrink: 0; }
  .btn:hover { background: var(--hover); border-color: var(--text-faint); color: var(--text); }
  .btn:active { transform: scale(.97); box-shadow: none; }
  .btn:disabled { opacity: .45; cursor: default; transform: none; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
  .btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--accent-fg); }
  .btn.danger { color: var(--danger); border-color: var(--danger-line); }
  .btn.danger:hover { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
  .btn.danger-solid { background: var(--danger); border-color: var(--danger); color: var(--danger-fg); }
  .btn.danger-solid:hover { background: var(--danger); border-color: var(--danger); filter: brightness(1.06); color: var(--danger-fg); }
  .btn.quiet { background: transparent; border-color: transparent; box-shadow: none; }
  .btn.quiet:hover { background: var(--hover); border-color: transparent; }
  .btn.sm { padding: 5px 10px; font-size: 12.5px; }

  select, .txt {
    background: var(--input); border: 1px solid var(--border); color: var(--text);
    padding: 9px 11px; border-radius: var(--r-sm); font-size: 13.5px;
    outline: none; transition: border-color .14s var(--ease), box-shadow .14s var(--ease);
  }
  select:focus, .txt:focus { border-color: var(--accent-line); box-shadow: 0 0 0 3px var(--ring); }
  .txt::placeholder { color: var(--text-faint); }

  /* segmento (Apariencia) */
  .seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border);
         border-radius: var(--r-sm); padding: 2px; gap: 2px; }
  .seg button {
    border: 0; background: transparent; color: var(--text-dim); cursor: pointer;
    padding: 5px 12px; border-radius: 7px; font-weight: 500;
    transition: background .14s var(--ease), color .14s var(--ease);
  }
  .seg button:hover { color: var(--text); }
  .seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow-xs); }

  /* ══════════════════════════════════════════════════════
     MODAL
     ══════════════════════════════════════════════════════ */
  #modal {
    position: fixed; inset: 0; background: var(--scrim);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 30; padding: 24px;
  }
  #modal.on { display: flex; animation: fade-in .16s var(--ease); }
  #modal.out { animation: fade-out .14s var(--ease) forwards; }
  #card {
    background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: var(--r-xl); width: 520px; max-width: 100%; max-height: 84vh;
    display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-lg);
    animation: pop-in .26s var(--ease) both;
  }
  #modal.out #card { animation: pop-out .14s var(--ease) forwards; }

  .m-head {
    display: flex; align-items: flex-start; gap: 12px; padding: 20px 20px 14px;

let me=null, current=null, currentName="", ws=null, LIMIT=100*1024*1024;

/* ══════════════════════════════════════════════════════════

const ICO = {

  key:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="14" r="4"/><path d="M11 11.5L20 3"/><path d="M17.5 5.5L19.5 7.5"/><path d="M15 8l2 2"/></svg>`,
  file:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5z"/><path d="M13.5 3v5.5H19"/></svg>`,
};

const api = async (p, o={}) => {
  const r = await fetch(p, { headers:{"Content-Type":"application/json"}, ...o });
  if (!r.ok) { const e = new Error(r.status); e.status = r.status;
                try { e.detail = (await r.json()).detail; } catch {} throw e; }
  return r.json();
};
const esc = s => { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; };
const human = n => n==null ? "" : n<1024 ? n+" B" : n<1048576 ? (n/1024).toFixed(1)+" KB"
                  : n<1073741824 ? (n/1048576).toFixed(1)+" MB" : (n/1073741824).toFixed(2)+" GB";
const nl2br = s => esc(s).replace(/\n/g, "<br>");
const escAttr = s => esc(s).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
/* Nombre que viaja dentro de un onclick="fn('...')": primero se escapa
   para JavaScript y después para HTML, si no un nombre con apóstrofo
   (o con comillas) rompe el atributo. */
const jsArg = s => escAttr(String(s ?? "").replace(/\\/g, "\\\\").replace(/'/g, "\\'"));

/* ══════════════════════════════════════════════════════════
   TEMA — claro / oscuro / automático
   ══════════════════════════════════════════════════════════ */
function getTheme() { try { return localStorage.getItem("puente-theme") || "auto"; } catch { return "auto"; } }
function setTheme(t) {
  try { localStorage.setItem("puente-theme", t); } catch {}
  document.documentElement.setAttribute("data-theme", t);
  document.querySelectorAll("#themeSeg button").forEach(b =>
    b.classList.toggle("on", b.dataset.theme === t));
}

/* ══════════════════════════════════════════════════════════
   TOASTS — reemplazan a los alert() de aviso
   ══════════════════════════════════════════════════════════ */
function toast(text, kind="info", ms=6000) {
  const box = document.getElementById("toasts");
  const ic = kind === "ok" ? ICO.check : kind === "danger" ? ICO.warn
           : kind === "warn" ? ICO.warn : ICO.info;
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.innerHTML = `<span class="t-ic">${ic}</span><div class="t-tx">${nl2br(text)}</div>
                  <button class="t-x" aria-label="Cerrar">${ICO.close}</button>`;
  const kill = () => {
    if (el.dataset.gone) return;
    el.dataset.gone = "1"; el.classList.add("out");
    setTimeout(() => el.remove(), 180);
  };
  el.querySelector(".t-x").onclick = kill;
  box.appendChild(el);
  if (ms) setTimeout(kill, ms);
  return el;
}

/* ══════════════════════════════════════════════════════════
   DIÁLOGOS — reemplazan alert / confirm / prompt nativos.
   Se apilan por encima del modal, así una confirmación no
   obliga a cerrar la ventana desde la que se pidió.
   ══════════════════════════════════════════════════════════ */
const dlgStack = [];

function showDialog({ title, message="", kind="info", input=null, buttons }) {
  return new Promise(resolve => {
    const ov = document.createElement("div");
    ov.className = "dlg-ov";
    const ic = kind === "danger" || kind === "warn" ? ICO.warn : kind === "ok" ? ICO.check : ICO.info;
    ov.innerHTML = `
      <div class="dlg" role="dialog" aria-modal="true">
        <div class="dlg-b">
          <div class="dlg-ico ${kind}">${ic}</div>
          <div class="dlg-txt">
            <div class="dlg-t">${esc(title)}</div>
            ${message ? `<div class="dlg-m">${nl2br(message)}</div>` : ""}
            ${input ? `<input class="txt dlg-i" placeholder="${escAttr(input.placeholder||"")}">` : ""}
          </div>
        </div>
        <div class="dlg-f"></div>
      </div>`;

    const inp = ov.querySelector(".dlg-i");
    if (inp && input.value) inp.value = input.value;

    let done = false;
    const finish = v => {
      if (done) return; done = true;
      const i = dlgStack.indexOf(ctl); if (i >= 0) dlgStack.splice(i, 1);
      ov.classList.add("out");
      setTimeout(() => { ov.remove(); if (prevFocus && prevFocus.focus) prevFocus.focus(); }, 150);
      resolve(v);
    };
    const ctl = { el: ov, cancel: () => finish(buttons[0].value) };
    const prevFocus = document.activeElement;

    const foot = ov.querySelector(".dlg-f");
    buttons.forEach(b => {
      const el = document.createElement("button");
      el.className = "btn" + (b.style ? " " + b.style : "");
      el.textContent = b.label;
      el.onclick = () => finish(typeof b.value === "function" ? b.value(inp) : b.value);
      foot.appendChild(el);
    });

    ov.addEventListener("mousedown", e => { if (e.target === ov) ctl.cancel(); });
    ov.addEventListener("keydown", e => {
      // Enter confirma, salvo cuando el foco ya está en un botón
      // (ahí manda el botón enfocado, no el de confirmar).
      if (e.key === "Enter" && e.target.tagName !== "BUTTON") {
        e.preventDefault(); foot.lastChild.click();
      }
      trapTab(ov, e);
    });

    document.getElementById("dialogs").appendChild(ov);
    dlgStack.push(ctl);
    setTimeout(() => { (inp || foot.lastChild).focus(); if (inp) inp.select(); }, 30);
  });
}

const ui = {
  alert: (message, o={}) => showDialog({
    title: o.title || "Aviso", message, kind: o.kind || "info",
    buttons: [{ label: o.ok || "Entendido", style: "primary", value: undefined }] }),

  confirm: (message, o={}) => showDialog({
    title: o.title || "¿Confirmar?", message, kind: o.kind || (o.danger ? "danger" : "warn"),
    buttons: [ { label: o.cancel || "Cancelar", value: false },
               { label: o.ok || "Confirmar", style: o.danger ? "danger-solid" : "primary", value: true } ] }),

  /* Devuelve string o null al cancelar — misma semántica que prompt(). */
  prompt: (message, o={}) => showDialog({
    title: o.title || "", message, kind: o.danger ? "danger" : "info",
    input: { value: o.value || "", placeholder: o.placeholder || "" },
    buttons: [ { label: "Cancelar", value: null },
               { label: o.ok || "Guardar", style: o.danger ? "danger-solid" : "primary",
                 value: i => i.value } ] }),
};

/* Copiar al portapapeles con respaldo: navigator.clipboard NO existe
   en http:// fuera de localhost, que es justo el caso de este hub en LAN. */
async function copyText(text, btn) {
  let ok = false;
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); ok = true; } } catch {}
  if (!ok) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
      ok = document.execCommand("copy"); ta.remove();
    } catch {}
  }
  if (btn && ok) {
    const prev = btn.innerHTML;
    btn.innerHTML = `${ICO.check}<span>Copiado</span>`;
    setTimeout(() => { btn.innerHTML = prev; }, 1600);
  }
  if (!ok) toast("No se pudo copiar automáticamente. Selecciona el enlace y cópialo a mano.", "warn");
}

/* ══════════════════════════════════════════════════════════
   MODAL
   ══════════════════════════════════════════════════════════ */
const modal = () => document.getElementById("modal");
const card  = () => document.getElementById("card");
let _modalTimer = null, _modalPrevFocus = null;

function modalShell({ title, sub="", body, foot="" }) {
  return `
    <div class="m-head">
      <div class="t"><h2>${title}</h2>${sub ? `<div class="sub">${sub}</div>` : ""}</div>
      <button class="iconbtn" data-close aria-label="Cerrar">${ICO.close}</button>
    </div>
    <div class="m-body">${body}</div>
    ${foot ? `<div class="m-foot">${foot}</div>` : ""}`;
}

/* Abre el modal (con animación de entrada). */
function openModal(o) {
  clearTimeout(_modalTimer);
  const m = modal();
  if (!m.classList.contains("on")) _modalPrevFocus = document.activeElement;
  m.classList.remove("out");
  card().innerHTML = typeof o === "string" ? o : modalShell(o);
  m.classList.add("on");
  setTimeout(() => {
    const f = card().querySelector(".m-body input, .m-body select, .m-body button, [data-close]");
    if (f) f.focus();
  }, 40);
}

/* Reemplaza el contenido SIN reanimar la tarjeta (para pasar de skeleton a datos). */
function fillModal(o) {
  if (!modal().classList.contains("on")) return openModal(o);
  card().innerHTML = typeof o === "string" ? o : modalShell(o);
}

/* Skeleton mientras se pide la información al hub. */
function openModalLoading(title) {
  openModal({ title, body: `<div class="sk t"></div><div class="sk a"></div>
    <div class="sk b"></div><div class="sk a"></div><div class="sk c"></div>` });
}

function closeModal() {
  const m = modal();
  if (!m.classList.contains("on")) return;
  m.classList.add("out");
  _modalTimer = setTimeout(() => {
    m.classList.remove("on", "out"); card().innerHTML = "";
    if (_modalPrevFocus && _modalPrevFocus.focus) _modalPrevFocus.focus();
  }, 150);
}

const modalOpen = () => modal().classList.contains("on") && !modal().classList.contains("out");

/* Cierre por [data-close] en cualquier parte del modal. */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-close]");
  if (b && card().contains(b)) closeModal();
});

/* Foco atrapado dentro del contenedor activo (accesibilidad). */
function trapTab(container, e) {
  if (e.key !== "Tab") return;
  const f = [...container.querySelectorAll('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])')]
              .filter(el => !el.disabled && el.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (dlgStack.length) { e.preventDefault(); dlgStack[dlgStack.length - 1].cancel(); }
    else if (modalOpen()) { e.preventDefault(); closeModal(); }
    return;
  }
  if (!dlgStack.length && modalOpen()) trapTab(card(), e);
});

/* ══════════════════════════════════════════════════════════
   GATE — pantallas previas al inicio de sesión
   ══════════════════════════════════════════════════════════ */
function renderGate(html) {
  document.getElementById("app").innerHTML = `
    <div id="gate-wrap"><div id="gate">
      <div class="mark">${ICO.bridge}</div>
      ${html}
    </div></div>`;
}

/* ══════════════════════════════════════════════════════════
   ARRANQUE
   ══════════════════════════════════════════════════════════ */
async function boot() {
  try { LIMIT = (await api("/api/limits")).max_bytes; } catch {}
  const m = location.pathname.match(/^\/i\/([^/]+)$/);
  if (m) return inviteFlow(m[1]);
  try { me = await api("/api/actor"); render(); loadBridges(); pollNotices(); }
  catch { gate(); }
}

/* ══════════════════════════════════════════════════════════
   INVITACIONES (alta rápida + recuperación + amistad)
   ══════════════════════════════════════════════════════════ */
async function inviteFlow(token) {
  let info;
  try { info = await api(`/api/invites/${token}`); }
  catch (e) {
    renderGate(`
      <h2>Enlace no válido</h2>
      <div class="sub">${e.status===410 ? "Esta invitación ya se usó o venció." : "No existe."}</div>`);
    return;
  }
  try { me = await api("/api/actor"); } catch { me = null; }

  if (info.kind === "reclaim") {
    renderGate(`
      <h2>Recuperar equipo</h2>
      <div class="sub">Este enlace te devuelve el acceso al equipo que lo generó, en este navegador.</div>
      <div class="actions">
        <button class="btn primary" onclick="doRedeem('${token}')">Recuperar acceso</button>
      </div>`);
    return;
  }

  if (info.kind === "friend") {
    const de = esc(info.from_name || "alguien");
    renderGate(`
      <h2>${de} quiere agregarte como amigo</h2>
      <div class="sub">Vas a poder aceptar o rechazar en el siguiente paso.</div>
      ${me ? "" : `<input id="nm" class="txt" placeholder="Torre, Notebook, VM...">`}
      <div class="actions">
        <button class="btn primary" onclick="doRedeem('${token}')">Continuar</button>
      </div>`);
    focusNameField(token);
    return;
  }

  const nombre = esc(info.bridge_name || "un puente");
  renderGate(`
    <h2>Unirte a «${nombre}»</h2>
    ${me ? `<div class="sub">Entrarás como <b>${esc(me.name)}</b>.</div>`
         : `<div class="sub">Elige un nombre para identificar este navegador.</div>
            <input id="nm" class="txt" placeholder="Torre, Notebook, VM...">`}
    <div class="actions">
      <button class="btn primary" onclick="doRedeem('${token}')">Unirme</button>
    </div>`);
  focusNameField(token);
}

function focusNameField(token) {
  const nm = document.getElementById("nm");
  if (!nm) return;
  nm.focus();
  nm.onkeydown = e => { if (e.key === "Enter") doRedeem(token); };
}

async function doRedeem(token) {
  const nmEl = document.getElementById("nm");
  try {
    const r = await api(`/api/invites/${token}/redeem`, {
      method: "POST", body: JSON.stringify({ name: nmEl ? nmEl.value.trim() : undefined }),
    });
    history.replaceState(null, "", "/");
    me = r.actor;

    if (r.kind === "friend") {
      renderGate(`
        <h2>Solicitud de ${esc(r.request.from_name)}</h2>
        <div class="sub">Si cierras esto sin elegir, la solicitud queda pendiente 7 días en «Amigos».</div>
        <div class="actions row">
          <button class="btn danger" onclick="answerFriendGate(${r.request.id}, 'reject')">Rechazar</button>
          <button class="btn primary" onclick="answerFriendGate(${r.request.id}, 'accept')">Aceptar</button>
        </div>`);
      return;
    }
    render(); loadBridges(); pollNotices();
  } catch (e) { toast(e.detail || "No se pudo canjear la invitación", "danger"); }
}

async function answerFriendGate(id, action) {
  try { await api(`/api/friends/${id}/${action}`, { method: "POST" });
        toast(action === "accept" ? "Solicitud aceptada." : "Solicitud rechazada.",
              action === "accept" ? "ok" : "info"); }
  catch (e) { toast(e.detail || "No se pudo responder", "danger"); }
  render(); loadBridges(); pollNotices();
}

function gate() {
  // Si entraste por IP cruda, crear el equipo aquí y configurar el nombre
  // DESPUÉS son dos sesiones distintas para el navegador (otro origen) y
  // vas a tener que crear el equipo de nuevo al pasarte a "puente". Por
  // eso el aviso va antes de crear el actor, no después (ADR-15).
  const isIP = /^\d{1,3}(\.\d{1,3}){3}$/.test(location.hostname);
  renderGate(`
    <h2>¿Qué equipo es este?</h2>
    <div class="sub">Elige un nombre para identificar este navegador.</div>
    <input id="nm" class="txt" placeholder="Torre, Notebook, VM...">
    <div class="actions">
      <button class="btn primary" onclick="join()">Entrar</button>
    </div>
    ${isIP ? `<div class="note">
      Entraste con una IP (<b>${esc(location.hostname)}</b>). Si vas a usar este equipo seguido,
      configura el acceso por nombre <b>antes</b> de crearlo — si lo haces después, vas a tener
      que crearlo de nuevo.
      <div style="margin-top:10px">
        <button class="btn sm" onclick="showHostHelp()">${ICO.globe}<span>Configurar acceso por nombre</span></button>
      </div>
    </div>` : ""}`);
  const nm = document.getElementById("nm");
  nm.focus();
  nm.onkeydown = e => { if (e.key === "Enter") join(); };
}

async function join() {
  const name = document.getElementById("nm").value.trim();
  if (!name) return;
  try { me = await api("/api/actor", { method:"POST", body: JSON.stringify({name}) }); }
  catch (e) { toast(e.detail || "No se pudo entrar", "danger"); return; }
  render(); loadBridges(); pollNotices();
}

/* ══════════════════════════════════════════════════════════
   INTERFAZ PRINCIPAL
   ══════════════════════════════════════════════════════════ */
function render() {
  document.getElementById("app").innerHTML = `
    <div id="side">
      <div class="brand">
        <div class="mark">${ICO.bridge}</div>
        <div class="name">Puente</div>
      </div>
      <div class="sec-label">Puentes</div>
      <div id="bridges"></div>
      <div id="sidefoot">
        <button class="sidebtn primary" onclick="newBridge()">${ICO.plus}<span>Nuevo puente</span></button>
        <button class="sidebtn" onclick="showFriends()">${ICO.users}<span>Amigos</span></button>
        <button class="sidebtn" onclick="showTrash()">${ICO.trash}<span>Papelera</span></button>
        <button class="sidebtn" onclick="showMaint()">${ICO.gear}<span>Configuración</span></button>
        <div class="whoami">
          <div class="avatar">${esc((me.name || "?").trim().charAt(0))}</div>
          <div class="t"><b>${esc(me.name)}</b><span>Este equipo</span></div>
          <button class="iconbtn" onclick="showRecover()" title="Recuperar este equipo en otro navegador"
                  style="width:28px;height:28px">${ICO.restore}</button>
        </div>
      </div>
    </div>
    <div id="main">
      <div id="drop">${ICO.upload}<span>Suelta el archivo para enviarlo</span></div>
      <div id="head" class="placeholder">Elige un puente</div>
      <div id="log"></div>
      <div id="prog"></div>
      <div id="err" class="err"></div>
      <div id="bar">
        <div id="composer">
          <button class="iconbtn" id="clip" onclick="pick.click()" title="Adjuntar archivo">${ICO.clip}</button>
          <input type="file" id="pick" style="display:none" onchange="pickFile(this)">
          <input id="input" placeholder="Escribe un mensaje" disabled>
          <button class="iconbtn" id="send" onclick="sendFromInput()" title="Enviar" disabled>${ICO.send}</button>
        </div>
      </div>
    </div>`;

  const input = document.getElementById("input"), send = document.getElementById("send");
  input.oninput = () => { send.disabled = !input.value.trim() || !current; };
  input.onkeydown = e => { if (e.key === "Enter") sendFromInput(); };

  const main = document.getElementById("main"), drop = document.getElementById("drop");
  main.ondragover = e => { e.preventDefault(); if (current) drop.classList.add("on"); };
  main.ondragleave = e => { if (e.target === main) drop.classList.remove("on"); };
  main.ondrop = e => { e.preventDefault(); drop.classList.remove("on");
    if (current && e.dataTransfer.files.length) upload(e.dataTransfer.files[0]); };
  document.onpaste = e => {
    if (!current || modalOpen() || dlgStack.length) return;
    const f = [...e.clipboardData.items].find(i => i.kind === "file");
    if (f) { e.preventDefault(); upload(f.getAsFile()); }
  };
}

function sendFromInput() {
  const input = document.getElementById("input");
  const v = input.value.trim();
  if (!v || !current) return;
  send(v); input.value = "";
  document.getElementById("send").disabled = true;
}

/* ══════════════════════════════════════════════════════════
   PUENTES
   ══════════════════════════════════════════════════════════ */
async function loadBridges() {
  const el = document.getElementById("bridges");
  if (el && !el.children.length)
    el.innerHTML = `<div class="sk a" style="margin:8px 10px"></div>
                    <div class="sk b" style="margin:8px 10px"></div>`;
  const list = await api("/api/bridges");
  if (!document.getElementById("bridges")) return;
  document.getElementById("bridges").innerHTML = list.length ? list.map(b => `
    <div class="bridge ${b.id===current?"active":""}" onclick="openBridge('${b.id}')">
      <span class="dot"></span>
      <span class="nm">${esc(b.name)}</span>
      <button class="gear" title="Ajustes del puente"
              onclick="event.stopPropagation();showPanel('${b.id}')">${ICO.gear}</button>
    </div>`).join("")
    : `<div class="empty left" style="padding:10px 12px">Sin puentes todavía.<br>Crea el primero abajo.</div>`;
  window._bridges = list;
}

async function newBridge() {
  const name = await ui.prompt("Puedes dejarlo vacío y se le asigna un nombre automático.",
    { title: "Nuevo puente", placeholder: "Nombre del puente", ok: "Crear" });
  if (name === null) return;
  await api("/api/bridges", { method:"POST", body: JSON.stringify({name: name.trim() || null}) });
  toast("Puente creado.", "ok", 3500);
  loadBridges();
}

async function openBridge(id) {
  const b = (window._bridges || []).find(x => x.id === id);
  current = id; currentName = b ? b.name : "";
  const head = document.getElementById("head");
  head.textContent = currentName; head.classList.remove("placeholder");
  const input = document.getElementById("input");
  input.disabled = false;
  document.getElementById("send").disabled = !input.value.trim();
  loadBridges();
  const msgs = await api(`/api/bridges/${id}/messages`);
  const log = document.getElementById("log");
  log.innerHTML = "";
  if (!msgs.length)
    log.innerHTML = `<div class="empty">Todavía no hay nada acá.<br>Escribe un mensaje o arrastra un archivo.</div>`;
  msgs.forEach(paint);
  connect(id);
}

function paint(m) {
  const log = document.getElementById("log");
  const vacio = log.querySelector(".empty");
  if (vacio) vacio.remove();
  const hora = new Date(m.created_at).toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});
  const div = document.createElement("div");
  div.className = "msg" + (m.actor_id === me.id ? " mine" : "");
  div.innerHTML = `<div class="meta">${esc(m.actor_name)} · ${hora}</div><div class="body"></div>`;
  const body = div.querySelector(".body");
  if (m.kind === "file") {
    const a = document.createElement("a");
    a.className = "file"; a.href = `/api/blob/${m.blob_hash}`; a.setAttribute("download","");
    const ic = document.createElement("span"); ic.className = "ic"; ic.innerHTML = ICO.download;
    const tx = document.createElement("span");
    const nm = document.createElement("span"); nm.className = "fn"; nm.textContent = m.filename;
    const sz = document.createElement("span"); sz.className = "sz"; sz.textContent = human(m.size);
    tx.append(nm, document.createElement("br"), sz);
    a.append(ic, tx); body.appendChild(a);
  } else body.textContent = m.body;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function connect(id) {
  if (ws) ws.close();
  ws = new WebSocket(`ws://${location.host}/api/bridges/${id}/ws`);
  ws.onmessage = e => { const m = JSON.parse(e.data); if (m.actor_id !== me.id) paint(m); };
}

async function send(body) {
  paint(await api(`/api/bridges/${current}/messages`, {method:"POST", body:JSON.stringify({body})}));
}

/* ══════════════════════════════════════════════════════════
   ARCHIVOS
   ══════════════════════════════════════════════════════════ */
function pickFile(el) { if (el.files.length) upload(el.files[0]); el.value = ""; }

function upload(file) {
  const err = document.getElementById("err"); err.textContent = "";
  if (file.size > LIMIT) {
    err.textContent = `"${file.name}" pesa ${human(file.size)}. El máximo es ${human(LIMIT)}.`;
    toast(`El archivo supera el límite de ${human(LIMIT)}.`, "danger");
    return;
  }
  const fd = new FormData(); fd.append("file", file);
  const xhr = new XMLHttpRequest(), prog = document.getElementById("prog");
  xhr.upload.onprogress = e => { if (e.lengthComputable) prog.style.width = (e.loaded/e.total*100)+"%"; };
  xhr.onload = () => { prog.style.width = "0";
    if (xhr.status === 200) paint(JSON.parse(xhr.responseText));
    else { err.textContent = "Error al subir: " + xhr.status;
           toast("No se pudo subir el archivo (error " + xhr.status + ").", "danger"); } };
  xhr.onerror = () => { prog.style.width = "0"; err.textContent = "Error de red";
                        toast("Error de red al subir el archivo.", "danger"); };
  xhr.open("POST", `/api/bridges/${current}/files`); xhr.send(fd);
}

/* ══════════════════════════════════════════════════════════
   PANEL DEL PUENTE
   ══════════════════════════════════════════════════════════ */
async function showPanel(id) {
  openModalLoading("Puente");
  let p;
  try { p = await api(`/api/bridges/${id}/panel`); }
  catch (e) { closeModal(); toast(e.detail || "No se pudo abrir el puente", "danger"); return; }
  const yo = p.owner_id === me.id;

  const miembros = p.members.map(m => `
    <div class="row">
      <span>${esc(m.name)}${m.role==="owner"?'<span class="tag">dueño</span>':""}
        ${m.id===me.id?'<span class="tag me">tú</span>':""}</span>

        ${yo && m.id!==p.owner_id ? `<button class="btn sm" onclick="doTransfer('${id}','${m.id}','${jsArg(m.name)}')">Hacer dueño</button>` : ""}
        ${(yo && m.id!==p.owner_id) || (m.id===me.id && !yo)
          ? `<button class="btn sm danger" onclick="dropMember('${id}','${m.id}',${m.id===me.id})">${m.id===me.id?"Salir":"Expulsar"}</button>` : ""}

  const puedeAgregar = yo && p.members.length < 5 && p.available.length;

    <div class="panel">

        <span class="ph-t">Agregar equipo<small>Solo aparecen tus amigos aceptados</small></span></div>
      <div class="panel-b">
        <div style="display:flex;gap:8px;padding:10px 0">
          <select id="pickActor" style="flex:1">
            ${p.available.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join("")}
          </select>
          <button class="btn primary" onclick="addMember('${id}')">Agregar</button>
        </div>
      </div>
    </div>` : yo ? `
    <div class="panel">
      <div class="panel-h"><span class="ph-ic">${ICO.users}</span><span class="ph-t">Agregar equipo</span></div>
      <div class="panel-b"><div class="hint">${
        p.members.length >= 5 ? "Tope de 5 equipos alcanzado."
        : 'No tienes amigos disponibles para agregar. Agrégalos primero desde <b>Amigos</b>, o usa el enlace de invitación de abajo para alguien nuevo.'}</div></div>
    </div>` : "";

  fillModal({
    title: esc(p.name),
    sub: `${p.messages} mensajes · ${human(p.bytes)} en archivos`,
    body: `
      <div class="panel">
        <div class="panel-h"><span class="ph-ic">${ICO.users}</span>
          <span class="ph-t">Equipos<small>${p.members.length} de 5</small></span></div>
        <div class="panel-b">${miembros}</div>
      </div>
      ${agregar}
      ${yo ? `
      <div class="panel">
        <div class="panel-h"><span class="ph-ic">${ICO.key}</span>
          <span class="ph-t">Invitar a alguien nuevo<small>Enlace de un solo uso, vence en 15 minutos</small></span></div>
        <div class="panel-b">
          <div class="row"><span class="lbl">Generar enlace + QR</span>
            <button class="btn primary sm" onclick="makeInvite('${id}')">Generar</button></div>
          <div id="inviteBox"></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-h"><span class="ph-ic">${ICO.gear}</span><span class="ph-t">Administración</span></div>
        <div class="panel-b">
          <div class="row"><span class="lbl">Renombrar el puente</span>
            <button class="btn sm" onclick="doRename('${id}','${jsArg(p.manual_name||"")}')">Renombrar</button></div>
          <div class="row"><span class="lbl">Mover a la papelera<small>Recuperable durante 7 días</small></span>
            <button class="btn sm danger" onclick="toTrash('${id}','${jsArg(p.name)}')">Eliminar</button></div>
        </div>
      </div>` : ""}`,
    foot: `<button class="btn" data-close>Cerrar</button>`,
  });
}

function inviteBoxHtml(url, token, footNote) {
  return `
    <div style="padding:6px 0 4px">
      <code>${esc(url)}</code>
      <div style="display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap">
        <button class="btn sm" onclick="copyText('${url}', this)">${ICO.copy}<span>Copiar enlace</span></button>
        ${footNote ? `<span class="tag">${footNote}</span>` : ""}
      </div>
      <img src="/api/invites/${token}/qr.svg" alt="Código QR del enlace" class="qr">
    </div>`;
}

async function makeInvite(id) {
  const box = document.getElementById("inviteBox");
  try {
    const r = await api(`/api/bridges/${id}/invites`, { method: "POST" });
    box.innerHTML = inviteBoxHtml(`${location.origin}${r.path}`, r.token, "vence en 15 min o al primer uso");
  } catch (e) { toast(e.detail || "No se pudo generar la invitación", "danger"); }
}

async function showRecover() {
  try {
    const r = await api("/api/actor/reclaim-invite", { method: "POST" });
    openModal({
      title: "Recuperar este equipo",
      sub: "Un solo uso, vence en 15 minutos",
      body: `<div class="hint">Abre este enlace en el navegador donde perdiste la sesión.
               Al usarlo, la sesión actual de este equipo se renueva por seguridad.</div>
             ${inviteBoxHtml(`${location.origin}${r.path}`, r.token)}`,
      foot: `<button class="btn" data-close>Cerrar</button>`,
    });
  } catch (e) { toast(e.detail || "No se pudo generar el enlace", "danger"); }
}

/* ══════════════════════════════════════════════════════════
   AMIGOS
   ══════════════════════════════════════════════════════════ */
async function showFriends() {
  openModalLoading("Amigos");
  let f;
  try { f = await api("/api/friends"); }
  catch (e) { closeModal(); toast(e.detail || "No se pudo cargar la lista de amigos", "danger"); return; }

  const amigos = f.friends.length ? f.friends.map(a => `
    <div class="row"><span>${esc(a.name)}</span>
      <button class="btn sm danger" onclick="unfriend('${a.id}','${jsArg(a.name)}')">Quitar</button></div>`
  ).join("") : `<div class="hint">Todavía no tienes amigos agregados.</div>`;

  const entrantes = f.incoming.length ? f.incoming.map(r => `
    <div class="row"><span>${esc(r.name)}</span>
      <span class="actions">
        <button class="btn sm danger" onclick="respondFriend(${r.id},'reject')">Rechazar</button>
        <button class="btn sm primary" onclick="respondFriend(${r.id},'accept')">Aceptar</button>
      </span></div>`
  ).join("") : "";

  const salientes = f.outgoing.length ? f.outgoing.map(r => `
    <div class="row"><span>${esc(r.name)}<span class="tag">esperando respuesta</span></span>
      <button class="btn sm" onclick="respondFriend(${r.id},'reject')">Cancelar</button></div>`
  ).join("") : "";

  fillModal({
    title: "Amigos",
    sub: "Solo puedes agregar a un puente a alguien que ya es tu amigo",
    body: `
      <div class="panel">
        <div class="panel-h"><span class="ph-ic">${ICO.key}</span>
          <span class="ph-t">Agregar amigo<small>Enlace de un solo uso, vence en 7 días</small></span></div>
        <div class="panel-b">
          <div class="row"><span class="lbl">Generar enlace + QR<small>La solicitud espera 7 días más</small></span>
            <button class="btn primary sm" onclick="makeFriendInvite()">Generar</button></div>
          <div id="friendInviteBox"></div>
        </div>
      </div>
      ${entrantes ? `
      <div class="panel">
        <div class="panel-h"><span class="ph-ic">${ICO.users}</span>
          <span class="ph-t">Solicitudes recibidas<small>${f.incoming.length} pendiente(s)</small></span></div>
        <div class="panel-b">${entrantes}</div>
      </div>` : ""}
      ${salientes ? `
      <div class="panel">
        <div class="panel-h"><span class="ph-ic">${ICO.users}</span>
          <span class="ph-t">Solicitudes enviadas<small>${f.outgoing.length} en espera</small></span></div>
        <div class="panel-b">${salientes}</div>
      </div>` : ""}
      <div class="panel">
        <div class="panel-h"><span class="ph-ic">${ICO.users}</span>
          <span class="ph-t">Tus amigos<small>${f.friends.length} equipo(s)</small></span></div>
        <div class="panel-b">${amigos}</div>
      </div>`,
    foot: `<button class="btn" data-close>Cerrar</button>`,
  });
}

async function makeFriendInvite() {
  const box = document.getElementById("friendInviteBox");
  try {
    const r = await api("/api/actor/friend-invite", { method: "POST" });
    box.innerHTML = inviteBoxHtml(`${location.origin}${r.path}`, r.token);
  } catch (e) { toast(e.detail || "No se pudo generar el enlace", "danger"); }
}

async function respondFriend(id, action) {
  try { await api(`/api/friends/${id}/${action}`, { method: "POST" });
        toast(action === "accept" ? "Ahora son amigos." : "Solicitud descartada.",
              action === "accept" ? "ok" : "info", 3500);
        showFriends(); }
  catch (e) { toast(e.detail || "No se pudo responder", "danger"); }
}

async function unfriend(id, name) {
  if (!await ui.confirm(`Dejarán de poder agregarse a puentes entre ustedes.`,
      { title: `¿Quitar a "${name}" de tus amigos?`, ok: "Quitar", danger: true })) return;
  try { await api(`/api/friends/${id}`, { method: "DELETE" }); toast("Amistad eliminada.", "info", 3500); showFriends(); }
  catch (e) { toast(e.detail || "No se pudo quitar", "danger"); }
}

async function addMember(id) {
  const aid = document.getElementById("pickActor").value;
  try { await api(`/api/bridges/${id}/actors/${aid}`, {method:"POST"});
        toast("Equipo agregado al puente.", "ok", 3500);
        showPanel(id); loadBridges(); }
  catch (e) { toast(e.detail || "No se pudo agregar", "danger"); }
}

async function dropMember(id, aid, propio) {
  const ok = propio
    ? await ui.confirm("Dejarás de ver sus mensajes y archivos.",
        { title: "¿Salir de este puente?", ok: "Salir", danger: true })
    : await ui.confirm("Dejará de ver los mensajes nuevos de este puente.",
        { title: "¿Quitar a este equipo del puente?", ok: "Expulsar", danger: true });
  if (!ok) return;
  try {
    await api(`/api/bridges/${id}/members/${aid}`, {method:"DELETE"});
    if (propio) { closeModal(); current = null;
      const head = document.getElementById("head");
      head.textContent = "Elige un puente"; head.classList.add("placeholder");
      document.getElementById("log").innerHTML = "";
      document.getElementById("input").disabled = true;
      document.getElementById("send").disabled = true;
      toast("Saliste del puente.", "info", 3500); }
    else { showPanel(id); toast("Equipo expulsado.", "info", 3500); }
    loadBridges();
  } catch (e) { toast(e.detail || "No se pudo", "danger"); }
}

async function doTransfer(id, aid, name) {
  if (!await ui.confirm(`Perderás el control del puente: ya no podrás renombrarlo, invitar ni eliminarlo.`,
      { title: `¿Transferir la propiedad a "${name}"?`, ok: "Transferir", danger: true })) return;
  try { await api(`/api/bridges/${id}/transfer`, {method:"POST", body:JSON.stringify({actor_id:aid})});
        toast(`"${name}" ahora es el dueño del puente.`, "ok");
        showPanel(id); loadBridges(); }
  catch (e) { toast(e.detail || "No se pudo transferir", "danger"); }
}

async function doRename(id, actual) {
  const n = await ui.prompt("Déjalo vacío para volver al nombre automático.",
    { title: "Renombrar puente", value: actual, placeholder: "Nombre del puente", ok: "Guardar" });
  if (n === null) return;
  await api(`/api/bridges/${id}`, {method:"PATCH", body:JSON.stringify({name:n.trim()||null})});
  toast("Nombre actualizado.", "ok", 3500);
  showPanel(id); loadBridges();
  if (current === id) { const b = (window._bridges||[]).find(x=>x.id===id);
    if (b) document.getElementById("head").textContent = b.name; }
}

async function toTrash(id, name) {
  const r = await ui.prompt(`Se puede recuperar durante 7 días desde la papelera.\nEscribe el nombre del puente para confirmar: ${name}`,
    { title: "Eliminar puente", placeholder: name, ok: "Eliminar", danger: true });
  if (r === null) return;
  if (r.trim() !== name) { toast("El nombre no coincide. No se eliminó nada.", "warn"); return; }
  await api(`/api/bridges/${id}`, {method:"DELETE"});
  closeModal();
  if (current === id) { current = null;
    const head = document.getElementById("head");
    head.textContent = "Elige un puente"; head.classList.add("placeholder");
    document.getElementById("log").innerHTML = "";
    document.getElementById("input").disabled = true;
    document.getElementById("send").disabled = true; if (ws) ws.close(); }
  toast(`"${name}" se movió a la papelera.`, "info");
  loadBridges();
}

/* ══════════════════════════════════════════════════════════
   PAPELERA
   ══════════════════════════════════════════════════════════ */
async function showTrash() {
  openModalLoading("Papelera");
  let items;
  try { items = await api("/api/trash"); }
  catch (e) { closeModal(); toast(e.detail || "No se pudo abrir la papelera", "danger"); return; }
  fillModal({
    title: "Papelera",
    sub: "Los puentes se eliminan solos a los 7 días",
    body: items.length ? `
      <div class="panel">
        <div class="panel-h"><span class="ph-ic">${ICO.trash}</span>
          <span class="ph-t">Puentes eliminados<small>${items.length} recuperable(s)</small></span></div>
        <div class="panel-b">${items.map(t => `
          <div class="row">
            <span class="lbl">${esc(t.name)}<small>Se borra solo el ${new Date(t.purge_at).toLocaleDateString("es-CL")}</small></span>
            <span class="actions">
              <button class="btn sm" onclick="restore('${t.id}')">Restaurar</button>
              <button class="btn sm danger" onclick="purge('${t.id}','${jsArg(t.name)}')">Borrar ya</button>
            </span>
          </div>`).join("")}</div>
      </div>`
      : `<div class="empty">La papelera está vacía.</div>`,
    foot: `<button class="btn" data-close>Cerrar</button>`,
  });
}

async function restore(id) {
  await api(`/api/trash/${id}/restore`, {method:"POST"});
  toast("Puente restaurado.", "ok", 3500);
  showTrash(); loadBridges();
}

async function purge(id, name) {
  if (!await ui.confirm("Se eliminan sus mensajes y archivos. No hay vuelta atrás.",
      { title: `¿Borrar "${name}" definitivamente?`, ok: "Borrar para siempre", danger: true })) return;
  const r = await api(`/api/trash/${id}`, {method:"DELETE"});
  toast(`Eliminado. ${r.blobs_borrados} archivo(s), ${human(r.bytes_liberados)} liberados.`, "ok");
  showTrash();
}

/* ══════════════════════════════════════════════════════════
   CONFIGURACIÓN — UNA sola ventana.
   Todos los estados comprobables (firewall, acceso por nombre)
   viven acá, al mismo nivel y con la misma forma:
   título · pill de estado · explicación · acción.
   Nada abre una segunda ventana encima.
   ══════════════════════════════════════════════════════════ */
async function showMaint() {
  openModalLoading("Configuración");

  // Se piden en paralelo; si "hostentry" falla, el bloque igual se dibuja degradado.
  let m, f, h;
  try {
    [m, f, h] = await Promise.all([
      api("/api/maintenance"),
      api("/api/firewall"),
      api("/api/hostentry").catch(() => null),
    ]);
  } catch (e) { closeModal(); toast(e.detail || "No se pudo cargar la configuración", "danger"); return; }

  const tema = getTheme();
  const segBtn = (v, l) => `<button data-theme="${v}" class="${tema===v?"on":""}" onclick="setTheme('${v}')">${l}</button>`;

  fillModal({
    title: "Configuración",
    sub: "Todo lo del hub en un solo lugar",
    body: `
      <!-- ── Apariencia ─────────────────────────────────── -->
      <div class="panel">
        <div class="panel-h"><span class="ph-ic">${ICO.paint}</span>
          <span class="ph-t">Apariencia<small>Se guarda en este navegador</small></span></div>
        <div class="panel-b">
          <div class="row"><span class="lbl">Tema<small>«Automático» sigue la preferencia del sistema</small></span>
            <span class="seg" id="themeSeg">
              ${segBtn("auto","Automático")}${segBtn("light","Claro")}${segBtn("dark","Oscuro")}
            </span></div>
        </div>
      </div>

      <!-- ── Almacenamiento ─────────────────────────────── -->
      <div class="panel">
        <div class="panel-h"><span class="ph-ic">${ICO.disk}</span>
          <span class="ph-t">Almacenamiento<small>${m.blobs_total} archivo(s) · ${human(m.bytes_total)}</small></span></div>
        <div class="panel-b">
          <div class="row"><span class="lbl">Archivos guardados</span><span>${m.blobs_total} · ${human(m.bytes_total)}</span></div>
          <div class="row"><span class="lbl">Basura recuperable<small>Contenido sin ningún mensaje que lo apunte</small></span>
            <span>${m.blobs_huerfanos} · ${human(m.bytes_recuperables)}</span></div>
          <div class="row"><span class="lbl">Liberar espacio no usado</span>
            <button class="btn primary sm" onclick="doClean()">Limpiar</button></div>
        </div>
      </div>

      <!-- ── Equipos sin uso ────────────────────────────── -->
      <div class="panel">
        <div class="panel-h"><span class="ph-ic">${ICO.users}</span>
          <span class="ph-t">Equipos sin uso<small>${m.actores_huerfanos.length} sin puentes ni mensajes</small></span></div>
        <div class="panel-b">
          ${m.actores_huerfanos.length ? m.actores_huerfanos.map(a => `
            <div class="row"><span class="lbl">${esc(a.name)}<small>Sin puentes ni mensajes</small></span>
              <button class="btn sm danger" onclick="dropActor('${a.id}')">Eliminar</button></div>`).join("")
            : `<div class="hint">No hay equipos sin uso.</div>`}
        </div>
      </div>

      <!-- ── Firewall — CHECK 1 ─────────────────────────── -->
      <div class="panel">
        <div class="panel-h"><span class="ph-ic">${ICO.shield}</span>
          <span class="ph-t">Firewall<small>${esc(f.backend || "no detectado")}</small></span>
          <span class="pill ${f.rule_exists ? "ok" : f.action_needed ? "bad" : "wait"}">
            ${f.rule_exists ? ICO.check + "Activa" : f.action_needed ? ICO.x + "Falta" : ICO.dash + "No hace falta"}</span>
        </div>
        <div class="panel-b">
          <div class="hint">Permite que los otros equipos de la red lleguen al hub por el puerto configurado.</div>
          ${f.note ? `<div class="hint">${esc(f.note)}</div>` : ""}
          ${f.command ? `<div class="hint">Comando que se ejecutará:<code>${esc(f.command)}</code></div>` : ""}
          ${f.action_needed ? `<div class="row"><span class="lbl">Aplicar la regla<small>Pedirá permisos de administrador</small></span>
            <button class="btn primary sm" onclick="applyFw()">Aplicar</button></div>` : ""}
        </div>
      </div>

      <!-- ── Acceso por nombre — CHECK 2, mismo nivel ───── -->
      <div class="panel">
        <div class="panel-h"><span class="ph-ic">${ICO.globe}</span>
          <span class="ph-t">Acceso por nombre<small>${h ? `http://${esc(h.hostname)}:${h.port}` : "no disponible"}</small></span>
          <span class="pill wait" id="hostPill"><span class="spin">${ICO.spinner}</span>Comprobando</span>
        </div>
        <div class="panel-b">
          ${h ? hostEntryBody(h) : `<div class="hint">No se pudo obtener la información del hub.</div>`}
        </div>
      </div>`,
    foot: `<button class="btn primary" data-close>Listo</button>`,
  });
  checkHostPill();
}

/* Cuerpo del bloque "acceso por nombre". Se usa TAL CUAL dentro de
   Configuración y, sin modal anidado, también en la pantalla previa
   al login (donde todavía no existe la ventana de configuración). */
function hostEntryBody(info) {
  return `
    <div class="hint">Permite entrar escribiendo <b>http://${esc(info.hostname)}:${info.port}</b>
      en vez de la IP. Se hace una vez en cada equipo nuevo (no hace falta en el equipo donde corre el hub).</div>
    <div class="row"><span class="lbl">1. Línea para el archivo <code class="inline">hosts</code></span></div>
    <code>${esc(info.line)}</code>
    <div class="row"><span class="lbl">Windows<small>Clic derecho → Ejecutar como administrador</small></span>
      <a class="btn sm primary" href="/api/hostentry/script?os=windows" download>${ICO.download}<span>Descargar .bat</span></a></div>
    <div class="row"><span class="lbl">Linux / macOS<small>sh agregar-puente.sh — pedirá tu contraseña</small></span>
      <a class="btn sm primary" href="/api/hostentry/script?os=unix" download>${ICO.download}<span>Descargar .sh</span></a></div>
    <div class="row"><span class="lbl">2. Verificar desde este equipo<small>Prueba si el nombre ya resuelve</small></span>
      <button class="btn sm" onclick="verifyHostEntry('${jsArg(info.hostname)}', ${info.port})">Comprobar</button></div>
    <div id="hostCheck"></div>`;
}

/* Pantalla previa al login: ahí no existe la ventana de Configuración,
   así que este es el único caso en que el bloque se muestra suelto. */
async function showHostHelp() {
  openModalLoading("Acceso por nombre");
  let info;
  try { info = await api("/api/hostentry"); }
  catch { closeModal(); toast("No se pudo obtener la información del hub.", "danger"); return; }
  fillModal({
    title: "Acceder por nombre en vez de IP",
    sub: `http://${esc(info.hostname)}:${info.port}`,
    body: `<div class="panel"><div class="panel-h">
             <span class="ph-ic">${ICO.globe}</span><span class="ph-t">Configurar en este equipo</span>
             <span class="pill wait" id="hostPill"><span class="spin">${ICO.spinner}</span>Comprobando</span>
           </div><div class="panel-b">${hostEntryBody(info)}</div></div>`,
    foot: `<button class="btn" data-close>Cerrar</button>`,
  });
  checkHostPill();
}

/* Comprobación de alcance por nombre. Ojo: el fetch cruza de origen
   (IP → hostname) y por eso el hub expone CORS solo-GET (ver ADR-15). */
async function probeHost(hostname, port, ms) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms);
  try { const r = await fetch(`http://${hostname}:${port}/api/limits`, { signal: ctrl.signal });
        return r.ok ? "ok" : "bad"; }
  catch { return "bad"; }
  finally { clearTimeout(t); }
}

function setHostPill(state) {
  const p = document.getElementById("hostPill");
  if (!p) return;
  if (state === "wait") { p.className = "pill wait"; p.innerHTML = `<span class="spin">${ICO.spinner}</span>Probando`; }
  else if (state === "ok") { p.className = "pill ok"; p.innerHTML = ICO.check + "Aprobado"; }
  else { p.className = "pill bad"; p.innerHTML = ICO.x + "Denegado"; }
}

async function checkHostPill() {
  if (!document.getElementById("hostPill")) return;
  let info;
  try { info = await api("/api/hostentry"); } catch { return; }
  setHostPill(await probeHost(info.hostname, info.port, 2000));
}

async function verifyHostEntry(hostname, port) {
  const box = document.getElementById("hostCheck");
  setHostPill("wait");
  if (box) box.innerHTML = `<div class="hint">Probando…</div>`;
  const r = await probeHost(hostname, port, 2500);
  setHostPill(r);
  if (!box) return;
  box.innerHTML = r === "ok"
    ? `<div class="hint" style="color:var(--ok)">Listo: ya puedes usar <b>http://${esc(hostname)}:${port}</b> en este equipo.</div>`
    : `<div class="hint" style="color:var(--danger)">Todavía no resuelve desde este equipo.
         Confirma que ejecutaste el script <b>aquí</b>, no en el equipo del hub, y prueba de nuevo.</div>`;
}

async function doClean() {
  const r = await api("/api/maintenance/clean", {method:"POST"});
  toast(`${r.blobs_borrados} archivo(s) eliminados, ${human(r.bytes_liberados)} liberados.`
        + (r.temporales ? `\n${r.temporales} temporal(es) limpiados.` : ""), "ok");
  showMaint();
}

async function dropActor(id) {
  if (!await ui.confirm("No tiene puentes ni mensajes, así que no se pierde contenido.",
      { title: "¿Eliminar este equipo?", ok: "Eliminar", danger: true })) return;
  try { await api(`/api/actors/${id}`, {method:"DELETE"}); toast("Equipo eliminado.", "info", 3500); showMaint(); }
  catch (e) { toast(e.detail || "No se pudo", "danger"); }
}

async function applyFw() {
  const r = await api("/api/firewall/apply", {method:"POST"});
  toast(r.applied ? "Regla de firewall aplicada." : "No se aplicó. Puedes ejecutar el comando a mano.",
        r.applied ? "ok" : "warn");
  showMaint();
}

/* ══════════════════════════════════════════════════════════
   AVISOS DEL HUB
   ══════════════════════════════════════════════════════════ */
async function pollNotices() {
  try {
    const list = await api("/api/notices");
    if (list.length) {
      list.forEach(n => toast(n.text, "info", 15000));
      loadBridges();
    }
  } catch {}
  setTimeout(pollNotices, 20000);
}

boot();
</script>
