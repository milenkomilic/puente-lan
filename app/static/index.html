<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puente</title>
<style>
  :root {
    --bg: #131316;
    --bg-raised: #1a1a1f;
    --bg-elevated: #202027;
    --bg-hover: #26262e;
    --bg-input: #1c1c22;
    --border: #2b2b33;
    --border-soft: #232329;
    --text: #ececee;
    --text-dim: #a3a2ab;
    --text-faint: #6f6e78;
    --accent: #4d7ef2;
    --accent-hover: #3f6de0;
    --accent-soft: rgba(77,126,242,.14);
    --danger: #ef5b52;
    --danger-soft: rgba(239,91,82,.12);
    --warn: #d9a441;
    --ok: #5fbf76;
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 18px;
    --shadow-lg: 0 24px 60px rgba(0,0,0,.45), 0 4px 16px rgba(0,0,0,.3);
    --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; display:flex; font-family: var(--font);
         background:var(--bg); color:var(--text); font-size:14px;
         -webkit-font-smoothing: antialiased; }
  button { font-family: inherit; font-size: 13px; }
  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:8px; border:2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background:#3a3a44; }

  /* ── layout ──────────────────────────────────────── */
  #app { flex:1; display:flex; }
  #side { width:264px; flex-shrink:0; border-right:1px solid var(--border-soft);
          display:flex; flex-direction:column; background:var(--bg-raised); }
  #side h1 { font-size:14px; font-weight:600; padding:16px 16px 14px;
             margin:0; display:flex; justify-content:space-between; align-items:center;
             letter-spacing:-.01em; }
  #side h1 .who { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #side h1 .who b { font-weight:600; }
  #bridges { flex:1; overflow-y:auto; padding:4px 8px; }
  .bridge { padding:9px 11px; cursor:pointer; border-radius:var(--radius-sm);
            display:flex; justify-content:space-between; align-items:center;
            margin-bottom:2px; color:var(--text-dim); transition:background .1s; }
  .bridge span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .bridge:hover { background:var(--bg-hover); color:var(--text); }
  .bridge.active { background:var(--accent-soft); color:var(--text); }
  .bridge .gear { opacity:0; color:var(--text-faint); padding:0 2px 0 8px; flex-shrink:0; }
  .bridge:hover .gear, .bridge.active .gear { opacity:1; }
  .bridge .gear:hover { color:var(--text); }
  #sidefoot { padding:10px; border-top:1px solid var(--border-soft);
              display:flex; flex-direction:column; gap:4px; }
  .sidebtn { padding:9px 12px; background:var(--accent); color:#fff; text-align:left;
             border:0; border-radius:var(--radius-sm); cursor:pointer; font-weight:500;
             transition:background .12s; }
  .sidebtn:hover { background:var(--accent-hover); }
  .sidebtn.ghost { background:transparent; color:var(--text-dim); font-weight:400; }
  .sidebtn.ghost:hover { background:var(--bg-hover); color:var(--text); }

  #main { flex:1; display:flex; flex-direction:column; position:relative; min-width:0; }
  #head { padding:15px 22px; border-bottom:1px solid var(--border-soft); font-weight:600;
          letter-spacing:-.01em; }
  #head.placeholder { color:var(--text-faint); font-weight:400; }
  #log { flex:1; overflow-y:auto; padding:22px 24px; }
  .msg { margin-bottom:14px; max-width:68%; }
  .msg.mine { margin-left:auto; text-align:right; }
  .meta { font-size:11.5px; color:var(--text-faint); margin-bottom:4px; }
  .body { background:var(--bg-elevated); padding:9px 14px; border-radius:var(--radius-md);
          display:inline-block; white-space:pre-wrap; text-align:left; line-height:1.45;
          box-shadow:var(--shadow-sm); }
  .msg.mine .body { background:var(--accent); color:#fff; }
  .file { display:flex; align-items:center; gap:9px; text-decoration:none; color:inherit; }
  .file .sz { font-size:11px; color:var(--text-dim); }
  .msg.mine .file .sz { color:rgba(255,255,255,.75); }

  #bar { padding:14px 20px 20px; }
  #composer { display:flex; gap:8px; align-items:center; background:var(--bg-input);
              border:1px solid var(--border); border-radius:var(--radius-lg);
              padding:6px 8px 6px 14px; transition:border-color .12s; }
  #composer:focus-within { border-color:#3d3d48; }
  #input { flex:1; padding:8px 0; background:transparent; border:0; outline:none;
           color:var(--text); font-size:14px; font-family:inherit; }
  #input::placeholder { color:var(--text-faint); }
  #input:disabled::placeholder { color:var(--text-faint); }
  #clip { background:none; border:0; color:var(--text-dim); font-size:19px; cursor:pointer;
          width:32px; height:32px; border-radius:50%; flex-shrink:0; transition:background .1s, color .1s; }
  #clip:hover { background:var(--bg-hover); color:var(--text); }

  #drop { position:absolute; inset:0; background:rgba(77,126,242,.1); backdrop-filter:blur(2px);
          border:2px dashed var(--accent); border-radius:var(--radius-lg); margin:10px;
          display:none; align-items:center; justify-content:center; pointer-events:none;
          z-index:5; font-weight:500; color:var(--accent); }
  #drop.on { display:flex; }
  #prog { height:2px; background:var(--accent); width:0; transition:width .15s; }
  .err { color:var(--danger); font-size:12px; padding:0 22px 6px; }
  .empty { color:var(--text-dim); font-size:13px; padding:10px 0; line-height:1.5; }

  /* ── pantallas de entrada (gate) ─────────────────── */
  #gate-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
  #gate { width:100%; max-width:380px; background:var(--bg-raised); border:1px solid var(--border-soft);
          border-radius:var(--radius-lg); padding:32px 30px; box-shadow:var(--shadow-lg);
          text-align:center; }
  #gate .brand { font-size:12px; color:var(--text-faint); text-transform:uppercase;
                 letter-spacing:.08em; margin-bottom:14px; font-weight:600; }
  #gate h2 { margin:0 0 8px; font-size:18px; font-weight:600; letter-spacing:-.01em; }
  #gate .sub { color:var(--text-dim); font-size:13.5px; line-height:1.5; margin-bottom:20px; }
  #gate .txt { width:100%; margin-bottom:12px; padding:11px 14px; font-size:14.5px; }
  #gate .actions { display:flex; flex-direction:column; gap:8px; }
  #gate .actions.row { flex-direction:row; }
  #gate .actions.row .mini { flex:1; }
  #gate .mini.go, #gate .mini.danger { padding:11px 16px; font-size:14px; font-weight:500; }

  /* ── modal ───────────────────────────────────────── */
  #modal { position:fixed; inset:0; background:rgba(8,8,10,.65); backdrop-filter:blur(3px);
           display:none; align-items:center; justify-content:center; z-index:20; padding:24px; }
  #modal.on { display:flex; }
  #card { background:var(--bg-raised); border:1px solid var(--border-soft);
          border-radius:var(--radius-lg); width:480px; max-height:82vh; overflow-y:auto;
          padding:24px; box-shadow:var(--shadow-lg); }
  #card h2 { margin:0 0 4px; font-size:17px; font-weight:600; letter-spacing:-.01em; }
  #card h3 { margin:22px 0 8px; font-size:11.5px; color:var(--text-faint);
             text-transform:uppercase; letter-spacing:.06em; font-weight:600; }
  #card h3:first-of-type { margin-top:18px; }
  .row { display:flex; justify-content:space-between; align-items:center;
         padding:9px 0; border-bottom:1px solid var(--border-soft); gap:10px; }
  .row:last-child { border:0; }
  .row > span:first-child { min-width:0; overflow-wrap:anywhere; }
  .tag { font-size:11px; color:var(--text-faint); margin-left:7px; }

  .pill { font-size:12px; font-weight:500; padding:3px 10px; border-radius:999px;
          white-space:nowrap; display:inline-flex; align-items:center; gap:5px; }
  .pill.ok { color:var(--ok); background:rgba(95,191,118,.12); }
  .pill.bad { color:var(--danger); background:var(--danger-soft); }
  .pill.wait { color:var(--text-faint); background:var(--bg-hover); }

  /* ── controles ───────────────────────────────────── */
  .mini { background:transparent; border:1px solid var(--border); color:var(--text-dim);
          padding:6px 11px; border-radius:var(--radius-sm); cursor:pointer;
          transition:border-color .12s, color .12s, background .12s; white-space:nowrap; }
  .mini:hover { border-color:#454550; color:var(--text); background:var(--bg-hover); }
  .mini.danger { color:var(--danger); border-color:rgba(239,91,82,.35); }
  .mini.danger:hover { background:var(--danger-soft); border-color:var(--danger); }
  .mini.go { background:var(--accent); border-color:var(--accent); color:#fff; }
  .mini.go:hover { background:var(--accent-hover); border-color:var(--accent-hover); }
  select, .txt { background:var(--bg-input); border:1px solid var(--border); color:var(--text);
                 padding:8px 10px; border-radius:var(--radius-sm); font-size:13.5px;
                 font-family:inherit; outline:none; transition:border-color .12s; }
  select:focus, .txt:focus { border-color:#454550; }

  code { background:var(--bg-elevated); padding:9px 11px; border-radius:var(--radius-sm);
         font-size:12px; word-break:break-all; display:block; margin-top:6px; line-height:1.5;
         border:1px solid var(--border-soft); color:var(--text-dim); }

  #notices { position:fixed; top:16px; right:16px; z-index:40; width:330px; }
  .notice { background:var(--bg-elevated); border:1px solid var(--border);
            border-left:3px solid var(--warn); padding:12px 14px; border-radius:var(--radius-sm);
            margin-bottom:8px; font-size:13px; box-shadow:var(--shadow-lg);
            display:flex; justify-content:space-between; gap:10px; }
  .notice button { background:none; border:0; color:var(--text-faint); cursor:pointer; font-size:15px; }
  .notice button:hover { color:var(--text); }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" onclick="if(event.target===this)closeModal()"><div id="card"></div></div>
<div id="notices"></div>
<script>
let me=null, current=null, currentName="", ws=null, LIMIT=100*1024*1024;

const api = async (p, o={}) => {
  const r = await fetch(p, { headers:{"Content-Type":"application/json"}, ...o });
  if (!r.ok) { const e = new Error(r.status); e.status = r.status;
                try { e.detail = (await r.json()).detail; } catch {} throw e; }
  return r.json();
};
const esc = s => { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; };
const human = n => n==null ? "" : n<1024 ? n+" B" : n<1048576 ? (n/1024).toFixed(1)+" KB"
                  : n<1073741824 ? (n/1048576).toFixed(1)+" MB" : (n/1073741824).toFixed(2)+" GB";

// ── pantalla de entrada centrada (gate) ────────────────
// Toda pantalla previa al inicio de sesión (nombre de equipo, invitaciones,
// solicitudes de amistad) pasa por acá, así queda centrada y con la misma
// tarjeta en un solo lugar en vez de repetirse en cada función.
function renderGate(html) {
  document.getElementById("app").innerHTML = `
    <div id="gate-wrap"><div id="gate">
      <div class="brand">Puente</div>
      ${html}
    </div></div>`;
}

// ── arranque ──────────────────────────────────────────
async function boot() {
  try { LIMIT = (await api("/api/limits")).max_bytes; } catch {}
  const m = location.pathname.match(/^\/i\/([^/]+)$/);
  if (m) return inviteFlow(m[1]);
  try { me = await api("/api/actor"); render(); loadBridges(); pollNotices(); }
  catch { gate(); }
}

// ── invitaciones (alta rápida + recuperación + amistad) ─
async function inviteFlow(token) {
  let info;
  try { info = await api(`/api/invites/${token}`); }
  catch (e) {
    renderGate(`
      <h2>Enlace no válido</h2>
      <div class="sub">${e.status===410 ? "Esta invitación ya se usó o venció." : "No existe."}</div>`);
    return;
  }
  try { me = await api("/api/actor"); } catch { me = null; }

  if (info.kind === "reclaim") {
    renderGate(`
      <h2>Recuperar equipo</h2>
      <div class="sub">Este enlace te devuelve el acceso al equipo que lo generó, en este navegador.</div>
      <div class="actions">
        <button class="mini go" onclick="doRedeem('${token}')">Recuperar acceso</button>
      </div>`);
    return;
  }

  if (info.kind === "friend") {
    const de = esc(info.from_name || "alguien");
    renderGate(`
      <h2>${de} quiere agregarte como amigo</h2>
      <div class="sub">Vas a poder aceptar o rechazar en el siguiente paso.</div>
      ${me ? "" : `<input id="nm" class="txt" placeholder="Torre, Notebook, VM...">`}
      <div class="actions">
        <button class="mini go" onclick="doRedeem('${token}')">Continuar</button>
      </div>`);
    focusNameField(token);
    return;
  }

  const nombre = esc(info.bridge_name || "un puente");
  renderGate(`
    <h2>Unirte a «${nombre}»</h2>
    ${me ? `<div class="sub">Entrarás como <b>${esc(me.name)}</b>.</div>`
         : `<input id="nm" class="txt" placeholder="Torre, Notebook, VM...">`}
    <div class="actions">
      <button class="mini go" onclick="doRedeem('${token}')">Unirme</button>
    </div>`);
  focusNameField(token);
}

function focusNameField(token) {
  const nm = document.getElementById("nm");
  if (!nm) return;
  nm.focus();
  nm.onkeydown = e => { if (e.key === "Enter") doRedeem(token); };
}

async function doRedeem(token) {
  const nmEl = document.getElementById("nm");
  try {
    const r = await api(`/api/invites/${token}/redeem`, {
      method: "POST", body: JSON.stringify({ name: nmEl ? nmEl.value.trim() : undefined }),
    });
    history.replaceState(null, "", "/");
    me = r.actor;

    if (r.kind === "friend") {
      renderGate(`
        <h2>Solicitud de ${esc(r.request.from_name)}</h2>
        <div class="sub">Si cierras esto sin elegir, la solicitud queda pendiente 7 días en «Amigos».</div>
        <div class="actions row">
          <button class="mini go" onclick="answerFriendGate(${r.request.id}, 'accept')">Aceptar</button>
          <button class="mini danger" onclick="answerFriendGate(${r.request.id}, 'reject')">Rechazar</button>
        </div>`);
      return;
    }
    render(); loadBridges(); pollNotices();
  } catch (e) { alert(e.detail || "No se pudo canjear la invitación"); }
}

async function answerFriendGate(id, action) {
  try { await api(`/api/friends/${id}/${action}`, { method: "POST" }); }
  catch (e) { alert(e.detail || "No se pudo responder"); }
  render(); loadBridges(); pollNotices();
}

function gate() {
  renderGate(`
    <h2>¿Qué equipo es este?</h2>
    <div class="sub">Elige un nombre para identificar este navegador.</div>
    <input id="nm" class="txt" placeholder="Torre, Notebook, VM...">
    <div class="actions">
      <button class="mini go" onclick="join()">Entrar</button>
    </div>`);
  const nm = document.getElementById("nm");
  nm.focus();
  nm.onkeydown = e => { if (e.key === "Enter") join(); };
}

// ── acceso por nombre en vez de IP ─────────────────────
async function showHostHelp() {
  let info;
  try { info = await api("/api/hostentry"); }
  catch { alert("No se pudo obtener la información del hub."); return; }

  openModal(`
    <h2>Acceder por nombre en vez de IP</h2>
    <div class="empty" style="margin-bottom:4px">
      Hazlo una vez en cada equipo nuevo (no hace falta en la torre, que ya se ve a sí misma).</div>

    <h3>1. Agrega esta línea a tu archivo hosts</h3>
    <code>${esc(info.line)}</code>
    <div class="row" style="margin-top:8px"><span>Windows</span>
      <a class="mini go" href="/api/hostentry/script?os=windows" download>Descargar .bat</a></div>
    <div class="row"><span>Linux / macOS</span>
      <a class="mini go" href="/api/hostentry/script?os=unix" download>Descargar .sh</a></div>
    <div class="empty">
      Windows: clic derecho sobre el archivo → <b>Ejecutar como administrador</b>.<br>
      Linux/macOS: <code style="display:inline;padding:2px 6px;margin:0">sh agregar-puente.sh</code> (pedirá tu contraseña).</div>

    <h3>2. Verifica</h3>
    <div class="row"><span>Probar <code style="display:inline;padding:2px 6px;margin:0">http://${esc(info.hostname)}:${info.port}</code></span>
      <span class="pill wait" id="hostCheckPill">— No probado</span></div>
    <div style="margin-top:10px">
      <button class="mini go" onclick="verifyHostEntry('${esc(info.hostname)}', ${info.port})">Comprobar</button></div>
    <div id="hostCheck"></div>

    <div style="text-align:right;margin-top:18px">
      <button class="mini" onclick="closeModal()">Cerrar</button></div>`);
}

async function verifyHostEntry(hostname, port) {
  const pill = document.getElementById("hostCheckPill");
  const box = document.getElementById("hostCheck");
  if (pill) { pill.className = "pill wait"; pill.textContent = "— Probando..."; }
  box.innerHTML = "";
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 2500);
    const r = await fetch(`http://${hostname}:${port}/api/limits`, { signal: ctrl.signal });
    clearTimeout(t);
    if (pill) { pill.className = "pill " + (r.ok ? "ok" : "bad"); pill.textContent = r.ok ? "✓ Aprobado" : "✕ Denegado"; }
    box.innerHTML = r.ok
      ? `<div class="empty" style="color:var(--ok)">Ya puedes usar http://${esc(hostname)}:${port}.</div>`
      : `<div class="empty" style="color:var(--danger)">Respondió, pero con error. Revisa el paso 1.</div>`;
  } catch {
    if (pill) { pill.className = "pill bad"; pill.textContent = "✕ Denegado"; }
    box.innerHTML = `<div class="empty" style="color:var(--danger)">
      Todavía no resuelve desde este equipo. Confirma que ejecutaste el script AQUÍ, no en la torre, y prueba de nuevo.</div>`;
  }
}

async function join() {
  const name = document.getElementById("nm").value.trim();
  if (!name) return;
  try { me = await api("/api/actor", { method:"POST", body: JSON.stringify({name}) }); }
  catch (e) { alert(e.detail || "No se pudo entrar"); return; }
  render(); loadBridges(); pollNotices();
}

function render() {
  document.getElementById("app").innerHTML = `
    <div id="side">
      <h1><span class="who">Puente · <b>${esc(me.name)}</b></span>
        <button class="mini" onclick="showRecover()" title="Recuperar este equipo en otro navegador" style="padding:3px 7px">⟲</button></h1>
      <div id="bridges"></div>
      <div id="sidefoot">
        <button class="sidebtn" onclick="newBridge()">+ Nuevo puente</button>
        <button class="sidebtn ghost" onclick="showFriends()">Amigos</button>
        <button class="sidebtn ghost" onclick="showTrash()">Papelera</button>
        <button class="sidebtn ghost" onclick="showMaint()">Configuración</button>
      </div>
    </div>
    <div id="main">
      <div id="drop">Suelta el archivo aquí</div>
      <div id="head" class="placeholder">Elige un puente</div>
      <div id="log"></div>
      <div id="prog"></div>
      <div id="err" class="err"></div>
      <div id="bar">
        <div id="composer">
          <button id="clip" onclick="pick.click()" title="Adjuntar">+</button>
          <input type="file" id="pick" style="display:none" onchange="pickFile(this)">
          <input id="input" placeholder="Escribe un mensaje" disabled>
        </div>
      </div>
    </div>`;

  document.getElementById("input").onkeydown = e => {
    if (e.key === "Enter" && e.target.value.trim()) {
      send(e.target.value.trim()); e.target.value = "";
    }
  };
  const main = document.getElementById("main"), drop = document.getElementById("drop");
  main.ondragover = e => { e.preventDefault(); if (current) drop.classList.add("on"); };
  main.ondragleave = e => { if (e.target === main) drop.classList.remove("on"); };
  main.ondrop = e => { e.preventDefault(); drop.classList.remove("on");
    if (current && e.dataTransfer.files.length) upload(e.dataTransfer.files[0]); };
  document.onpaste = e => {
    if (!current || document.getElementById("modal").classList.contains("on")) return;
    const f = [...e.clipboardData.items].find(i => i.kind === "file");
    if (f) { e.preventDefault(); upload(f.getAsFile()); }
  };
}

// ── puentes ───────────────────────────────────────────
async function loadBridges() {
  const list = await api("/api/bridges");
  const el = document.getElementById("bridges");
  el.innerHTML = list.length ? list.map(b => `
    <div class="bridge ${b.id===current?"active":""}" onclick="openBridge('${b.id}')">
      <span>${esc(b.name)}</span>
      <span class="gear" onclick="event.stopPropagation();showPanel('${b.id}')">⚙</span>
    </div>`).join("") : `<div class="empty" style="padding:10px 12px">Sin puentes todavía</div>`;
  window._bridges = list;
}

async function newBridge() {
  const name = prompt("Nombre del puente (vacío = automático)");
  if (name === null) return;
  await api("/api/bridges", { method:"POST", body: JSON.stringify({name: name.trim() || null}) });
  loadBridges();
}

async function openBridge(id) {
  const b = (window._bridges || []).find(x => x.id === id);
  current = id; currentName = b ? b.name : "";
  const head = document.getElementById("head");
  head.textContent = currentName; head.classList.remove("placeholder");
  document.getElementById("input").disabled = false;
  loadBridges();
  const msgs = await api(`/api/bridges/${id}/messages`);
  const log = document.getElementById("log");
  log.innerHTML = "";
  msgs.forEach(paint);
  connect(id);
}

function paint(m) {
  const log = document.getElementById("log");
  const hora = new Date(m.created_at).toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});
  const div = document.createElement("div");
  div.className = "msg" + (m.actor_id === me.id ? " mine" : "");
  div.innerHTML = `<div class="meta">${esc(m.actor_name)} · ${hora}</div><div class="body"></div>`;
  const body = div.querySelector(".body");
  if (m.kind === "file") {
    const a = document.createElement("a");
    a.className = "file"; a.href = `/api/blob/${m.blob_hash}`; a.setAttribute("download","");
    const nm = document.createElement("span"); nm.textContent = m.filename;
    const sz = document.createElement("span"); sz.className = "sz"; sz.textContent = human(m.size);
    a.append("⭳ ", nm, sz); body.appendChild(a);
  } else body.textContent = m.body;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function connect(id) {
  if (ws) ws.close();
  ws = new WebSocket(`ws://${location.host}/api/bridges/${id}/ws`);
  ws.onmessage = e => { const m = JSON.parse(e.data); if (m.actor_id !== me.id) paint(m); };
}

async function send(body) {
  paint(await api(`/api/bridges/${current}/messages`, {method:"POST", body:JSON.stringify({body})}));
}

// ── archivos ──────────────────────────────────────────
function pickFile(el) { if (el.files.length) upload(el.files[0]); el.value = ""; }

function upload(file) {
  const err = document.getElementById("err"); err.textContent = "";
  if (file.size > LIMIT) {
    err.textContent = `"${file.name}" pesa ${human(file.size)}. El máximo es ${human(LIMIT)}.`;
    return;
  }
  const fd = new FormData(); fd.append("file", file);
  const xhr = new XMLHttpRequest(), prog = document.getElementById("prog");
  xhr.upload.onprogress = e => { if (e.lengthComputable) prog.style.width = (e.loaded/e.total*100)+"%"; };
  xhr.onload = () => { prog.style.width = "0";
    if (xhr.status === 200) paint(JSON.parse(xhr.responseText));
    else err.textContent = "Error al subir: " + xhr.status; };
  xhr.onerror = () => { prog.style.width = "0"; err.textContent = "Error de red"; };
  xhr.open("POST", `/api/bridges/${current}/files`); xhr.send(fd);
}

// ── modal ─────────────────────────────────────────────
const modal = () => document.getElementById("modal");
const card = () => document.getElementById("card");
function closeModal() { modal().classList.remove("on"); }
function openModal(html) { card().innerHTML = html; modal().classList.add("on"); }

// ── panel del puente ──────────────────────────────────
async function showPanel(id) {
  const p = await api(`/api/bridges/${id}/panel`);
  const yo = p.owner_id === me.id;

  const miembros = p.members.map(m => `
    <div class="row">
      <span>${esc(m.name)}${m.role==="owner"?'<span class="tag">dueño</span>':""}
        ${m.id===me.id?'<span class="tag">tú</span>':""}</span>
      <span>
        ${yo && m.id!==p.owner_id ? `<button class="mini" onclick="doTransfer('${id}','${m.id}','${esc(m.name)}')">Hacer dueño</button>` : ""}
        ${(yo && m.id!==p.owner_id) || (m.id===me.id && !yo)
          ? `<button class="mini danger" onclick="dropMember('${id}','${m.id}',${m.id===me.id})">${m.id===me.id?"Salir":"Expulsar"}</button>` : ""}
      </span>
    </div>`).join("");

  const puedeAgregar = yo && p.members.length < 5 && p.available.length;
  const agregar = puedeAgregar ? `
    <h3>Agregar equipo</h3>
    <div style="display:flex;gap:8px">
      <select id="pickActor" style="flex:1">
        ${p.available.map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join("")}
      </select>
      <button class="mini go" onclick="addMember('${id}')">Agregar</button>
    </div>` : yo ? `<h3>Agregar equipo</h3><div class="empty">${
      p.members.length >= 5 ? "Tope de 5 equipos alcanzado."
      : 'No tienes amigos disponibles para agregar. Agrégalos primero desde <b>Amigos</b>, o usa el enlace de invitación de abajo para alguien nuevo.'}</div>` : "";

  openModal(`
    <h2>${esc(p.name)}</h2>
    <div class="empty">${p.messages} mensajes · ${human(p.bytes)} en archivos</div>
    <h3>Equipos (${p.members.length}/5)</h3>${miembros}
    ${agregar}
    ${yo ? `
      <h3>Invitar</h3>
      <div class="row"><span>Enlace de un solo uso, vence en 15 min</span>
        <button class="mini go" onclick="makeInvite('${id}')">Generar</button></div>
      <div id="inviteBox"></div>
      <h3>Administración</h3>
      <div class="row"><span>Renombrar el puente</span>
        <button class="mini" onclick="doRename('${id}','${esc(p.manual_name||"")}')">Renombrar</button></div>
      <div class="row"><span>Mover a la papelera<span class="tag">recuperable 7 días</span></span>
        <button class="mini danger" onclick="toTrash('${id}','${esc(p.name)}')">Eliminar</button></div>` : ""}
    <div style="text-align:right;margin-top:18px">
      <button class="mini" onclick="closeModal()">Cerrar</button></div>`);
}

function inviteBoxHtml(url, token, footNote) {
  return `
    <div style="margin:8px 0">
      <code>${esc(url)}</code>
      <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
        <button class="mini" onclick="navigator.clipboard.writeText('${url}')">Copiar enlace</button>
        ${footNote ? `<span class="tag">${footNote}</span>` : ""}
      </div>
      <img src="/api/invites/${token}/qr.svg" alt="QR"
           style="margin-top:10px;background:#fff;padding:8px;border-radius:10px;width:176px;display:block">
    </div>`;
}

async function makeInvite(id) {
  const box = document.getElementById("inviteBox");
  try {
    const r = await api(`/api/bridges/${id}/invites`, { method: "POST" });
    box.innerHTML = inviteBoxHtml(`${location.origin}${r.path}`, r.token, "vence en 15 min o al primer uso");
  } catch (e) { alert(e.detail || "No se pudo generar la invitación"); }
}

async function showRecover() {
  try {
    const r = await api("/api/actor/reclaim-invite", { method: "POST" });
    openModal(`
      <h2>Recuperar este equipo</h2>
      <div class="empty" style="margin-bottom:4px">
        Abre este enlace en el navegador donde perdiste la sesión. Un solo uso, vence en 15 minutos.</div>
      ${inviteBoxHtml(`${location.origin}${r.path}`, r.token)}
      <div style="text-align:right;margin-top:18px">
        <button class="mini" onclick="closeModal()">Cerrar</button></div>`);
  } catch (e) { alert(e.detail || "No se pudo generar el enlace"); }
}

// ── amigos ────────────────────────────────────────────
async function showFriends() {
  const f = await api("/api/friends");

  const amigos = f.friends.length ? f.friends.map(a => `
    <div class="row"><span>${esc(a.name)}</span>
      <button class="mini danger" onclick="unfriend('${a.id}','${esc(a.name)}')">Quitar</button></div>`
  ).join("") : `<div class="empty">Todavía no tienes amigos agregados.</div>`;

  const entrantes = f.incoming.length ? f.incoming.map(r => `
    <div class="row"><span>${esc(r.name)}</span>
      <span>
        <button class="mini go" onclick="respondFriend(${r.id},'accept')">Aceptar</button>
        <button class="mini danger" onclick="respondFriend(${r.id},'reject')">Rechazar</button>
      </span></div>`
  ).join("") : "";

  const salientes = f.outgoing.length ? f.outgoing.map(r => `
    <div class="row"><span>${esc(r.name)}<span class="tag">esperando respuesta</span></span>
      <button class="mini" onclick="respondFriend(${r.id},'reject')">Cancelar</button></div>`
  ).join("") : "";

  openModal(`
    <h2>Amigos</h2>
    <div class="empty" style="margin-bottom:4px">Solo puedes agregar a un puente a alguien que ya es tu amigo.</div>

    <h3>Agregar amigo</h3>
    <div class="row"><span>Enlace de un solo uso, vence en 7 días; la solicitud espera 7 días más</span>
      <button class="mini go" onclick="makeFriendInvite()">Generar</button></div>
    <div id="friendInviteBox"></div>

    ${entrantes ? `<h3>Solicitudes recibidas</h3>${entrantes}` : ""}
    ${salientes ? `<h3>Solicitudes enviadas</h3>${salientes}` : ""}

    <h3>Tus amigos (${f.friends.length})</h3>${amigos}

    <div style="text-align:right;margin-top:18px">
      <button class="mini" onclick="closeModal()">Cerrar</button></div>`);
}

async function makeFriendInvite() {
  const box = document.getElementById("friendInviteBox");
  try {
    const r = await api("/api/actor/friend-invite", { method: "POST" });
    box.innerHTML = inviteBoxHtml(`${location.origin}${r.path}`, r.token);
  } catch (e) { alert(e.detail || "No se pudo generar el enlace"); }
}

async function respondFriend(id, action) {
  try { await api(`/api/friends/${id}/${action}`, { method: "POST" }); showFriends(); }
  catch (e) { alert(e.detail || "No se pudo responder"); }
}

async function unfriend(id, name) {
  if (!confirm(`¿Quitar a "${name}" de tus amigos?`)) return;
  try { await api(`/api/friends/${id}`, { method: "DELETE" }); showFriends(); }
  catch (e) { alert(e.detail || "No se pudo quitar"); }
}

async function addMember(id) {
  const aid = document.getElementById("pickActor").value;
  try { await api(`/api/bridges/${id}/actors/${aid}`, {method:"POST"});
        showPanel(id); loadBridges(); }
  catch (e) { alert(e.detail || "No se pudo agregar"); }
}

async function dropMember(id, aid, propio) {
  if (!confirm(propio ? "¿Salir de este puente?" : "¿Quitar a este equipo del puente?")) return;
  try {
    await api(`/api/bridges/${id}/members/${aid}`, {method:"DELETE"});
    if (propio) { closeModal(); current = null;
      const head = document.getElementById("head");
      head.textContent = "Elige un puente"; head.classList.add("placeholder");
      document.getElementById("log").innerHTML = "";
      document.getElementById("input").disabled = true; }
    else showPanel(id);
    loadBridges();
  } catch (e) { alert(e.detail || "No se pudo"); }
}

async function doTransfer(id, aid, name) {
  if (!confirm(`Transferir la propiedad a "${name}"?\n\nPerderás el control del puente.`)) return;
  try { await api(`/api/bridges/${id}/transfer`, {method:"POST", body:JSON.stringify({actor_id:aid})});
        showPanel(id); loadBridges(); }
  catch (e) { alert(e.detail || "No se pudo transferir"); }
}

async function doRename(id, actual) {
  const n = prompt("Nuevo nombre (vacío = automático)", actual);
  if (n === null) return;
  await api(`/api/bridges/${id}`, {method:"PATCH", body:JSON.stringify({name:n.trim()||null})});
  showPanel(id); loadBridges();
  if (current === id) { const b = (window._bridges||[]).find(x=>x.id===id);
    if (b) document.getElementById("head").textContent = b.name; }
}

async function toTrash(id, name) {
  const r = prompt(`Escribe el nombre del puente para confirmar:\n\n${name}`);
  if (r === null) return;
  if (r.trim() !== name) { alert("El nombre no coincide. No se eliminó nada."); return; }
  await api(`/api/bridges/${id}`, {method:"DELETE"});
  closeModal();
  if (current === id) { current = null;
    const head = document.getElementById("head");
    head.textContent = "Elige un puente"; head.classList.add("placeholder");
    document.getElementById("log").innerHTML = "";
    document.getElementById("input").disabled = true; if (ws) ws.close(); }
  loadBridges();
}

// ── papelera ──────────────────────────────────────────
async function showTrash() {
  const items = await api("/api/trash");
  openModal(`
    <h2>Papelera</h2>
    <div class="empty">Los puentes se eliminan solos a los 7 días.</div>
    ${items.length ? items.map(t => `
      <div class="row">
        <span>${esc(t.name)}<span class="tag">hasta ${new Date(t.purge_at).toLocaleDateString("es-CL")}</span></span>
        <span>
          <button class="mini" onclick="restore('${t.id}')">Restaurar</button>
          <button class="mini danger" onclick="purge('${t.id}','${esc(t.name)}')">Borrar ya</button>
        </span>
      </div>`).join("") : `<div class="empty">La papelera está vacía.</div>`}
    <div style="text-align:right;margin-top:18px">
      <button class="mini" onclick="closeModal()">Cerrar</button></div>`);
}

async function restore(id) {
  await api(`/api/trash/${id}/restore`, {method:"POST"});
  showTrash(); loadBridges();
}

async function purge(id, name) {
  if (!confirm(`Borrar "${name}" definitivamente?\n\nSe eliminan sus mensajes y archivos. No hay vuelta atrás.`)) return;
  const r = await api(`/api/trash/${id}`, {method:"DELETE"});
  alert(`Eliminado.\n${r.blobs_borrados} archivo(s), ${human(r.bytes_liberados)} liberados.`);
  showTrash();
}

// ── mantenimiento ─────────────────────────────────────
async function showMaint() {
  const [m, f] = await Promise.all([api("/api/maintenance"), api("/api/firewall")]);
  openModal(`
    <h2>Configuración</h2>
    <h3>Almacenamiento</h3>
    <div class="row"><span>Archivos guardados</span><span>${m.blobs_total} · ${human(m.bytes_total)}</span></div>
    <div class="row"><span>Basura recuperable</span><span>${m.blobs_huerfanos} · ${human(m.bytes_recuperables)}</span></div>
    <div class="row"><span>Liberar espacio no usado</span>
      <button class="mini go" onclick="doClean()">Limpiar</button></div>

    <h3>Equipos sin uso</h3>
    ${m.actores_huerfanos.length ? m.actores_huerfanos.map(a => `
      <div class="row"><span>${esc(a.name)}<span class="tag">sin puentes ni mensajes</span></span>
        <button class="mini danger" onclick="dropActor('${a.id}')">Eliminar</button></div>`).join("")
      : `<div class="empty">No hay equipos sin uso.</div>`}

    <h3>Firewall (${esc(f.backend || "no detectado")})</h3>
    <div class="row"><span>Regla del puerto 8080</span>
      <span class="pill ${f.rule_exists ? "ok" : f.action_needed ? "bad" : "wait"}">
        ${f.rule_exists ? "✓ Activa" : f.action_needed ? "✕ Falta" : "— No hace falta"}</span></div>
    ${f.note ? `<div class="empty">${esc(f.note)}</div>` : ""}
    ${f.command ? `<div class="empty">Comando que se ejecutará:<code>${esc(f.command)}</code></div>` : ""}
    ${f.action_needed ? `<div style="margin-top:10px">
      <button class="mini go" onclick="applyFw()">Aplicar (pedirá permisos)</button></div>` : ""}

    <h3>Acceso por nombre</h3>
    <div class="row"><span>En este equipo</span>
      <span class="pill wait" id="hostPill">— Comprobando...</span></div>
    <div style="margin-top:10px">
      <button class="mini go" onclick="showHostHelp()">Ver instrucciones</button></div>

    <div style="text-align:right;margin-top:18px">
      <button class="mini" onclick="closeModal()">Cerrar</button></div>`);
  checkHostPill();
}

async function checkHostPill() {
  const pill = document.getElementById("hostPill");
  if (!pill) return;
  let info;
  try { info = await api("/api/hostentry"); } catch { return; }
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 2000);
    const r = await fetch(`http://${info.hostname}:${info.port}/api/limits`, { signal: ctrl.signal });
    clearTimeout(t);
    const p = document.getElementById("hostPill");
    if (!p) return;
    p.className = "pill " + (r.ok ? "ok" : "bad");
    p.textContent = r.ok ? "✓ Aprobado" : "✕ Denegado";
  } catch {
    const p = document.getElementById("hostPill");
    if (!p) return;
    p.className = "pill bad";
    p.textContent = "✕ Denegado";
  }
}

async function doClean() {
  const r = await api("/api/maintenance/clean", {method:"POST"});
  alert(`${r.blobs_borrados} archivo(s) eliminados, ${human(r.bytes_liberados)} liberados.`
        + (r.temporales ? `\n${r.temporales} temporal(es) limpiados.` : ""));
  showMaint();
}

async function dropActor(id) {
  if (!confirm("¿Eliminar este equipo?")) return;
  try { await api(`/api/actors/${id}`, {method:"DELETE"}); showMaint(); }
  catch (e) { alert(e.detail || "No se pudo"); }
}

async function applyFw() {
  const r = await api("/api/firewall/apply", {method:"POST"});
  alert(r.applied ? "Regla aplicada." : "No se aplicó. Puedes ejecutar el comando a mano.");
  showMaint();
}

// ── avisos ────────────────────────────────────────────
async function pollNotices() {
  try {
    const list = await api("/api/notices");
    if (list.length) {
      const box = document.getElementById("notices");
      list.forEach(n => {
        const d = document.createElement("div");
        d.className = "notice";
        d.innerHTML = `<span>${esc(n.text)}</span><button onclick="this.parentNode.remove()">×</button>`;
        box.appendChild(d);
        setTimeout(() => d.remove(), 15000);
      });
      loadBridges();
    }
  } catch {}
  setTimeout(pollNotices, 20000);
}

boot();
</script>
</body>
</html>
