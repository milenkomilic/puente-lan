<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puente</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; font-family: system-ui, sans-serif;
         background:#16161a; color:#e8e6e3; }
  #side { width:260px; border-right:1px solid #2c2c31; display:flex; flex-direction:column; }
  #side h1 { font-size:15px; padding:16px; margin:0; border-bottom:1px solid #2c2c31; }
  #bridges { flex:1; overflow-y:auto; }
  .bridge { padding:12px 16px; cursor:pointer; border-bottom:1px solid #212126; font-size:14px; }
  .bridge:hover { background:#1e1e23; }
  .bridge.active { background:#26262d; }
  #side button { margin:12px; padding:8px; background:#2f6fd0; color:#fff;
                 border:0; border-radius:6px; cursor:pointer; }
  #main { flex:1; display:flex; flex-direction:column; position:relative; }
  #head { padding:14px 20px; border-bottom:1px solid #2c2c31; font-size:14px; }
  #log { flex:1; overflow-y:auto; padding:20px; }
  .msg { margin-bottom:14px; max-width:70%; }
  .msg.mine { margin-left:auto; text-align:right; }
  .meta { font-size:11px; color:#8b8a92; margin-bottom:3px; }
  .body { background:#26262d; padding:9px 13px; border-radius:10px;
          display:inline-block; white-space:pre-wrap; text-align:left; }
  .msg.mine .body { background:#2f6fd0; }
  .file { display:flex; align-items:center; gap:10px; text-decoration:none;
          color:inherit; }
  .file .nm { font-size:14px; }
  .file .sz { font-size:11px; color:#a9a8b0; }
  #bar { padding:14px 20px; border-top:1px solid #2c2c31; display:flex;
         gap:10px; align-items:center; }
  #input { flex:1; padding:10px 14px; background:#26262d; border:1px solid #35353d;
           border-radius:8px; color:#e8e6e3; font-size:14px; }
  #clip { background:none; border:0; color:#8b8a92; font-size:20px; cursor:pointer; }
  #drop { position:absolute; inset:0; background:rgba(47,111,208,.15);
          border:2px dashed #2f6fd0; display:none; align-items:center;
          justify-content:center; font-size:17px; pointer-events:none; z-index:5; }
  #drop.on { display:flex; }
  #prog { height:3px; background:#2f6fd0; width:0; transition:width .15s; }
  #gate { margin:auto; text-align:center; }
  .err { color:#e2564b; font-size:12px; padding:0 20px 8px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
let me = null, current = null, ws = null, LIMIT = 100 * 1024 * 1024;

async function api(path, opts = {}) {
  const r = await fetch(path, { headers:{ "Content-Type":"application/json" }, ...opts });
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

function human(n) {
  if (n == null) return "";
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n/1024).toFixed(1) + " KB";
  return (n/1048576).toFixed(1) + " MB";
}

async function boot() {
  try { const l = await fetch("/api/limits").then(r=>r.json()); LIMIT = l.max_bytes; } catch {}
  try { me = await api("/api/actor"); render(); loadBridges(); }
  catch { gate(); }
}

function gate() {
  document.getElementById("app").innerHTML = `
    <div id="gate">
      <h2>¿Qué equipo es este?</h2>
      <input id="nm" placeholder="Torre, Notebook, VM..." style="padding:10px;font-size:15px">
      <button onclick="join()" style="padding:10px 16px;margin-left:8px">Entrar</button>
    </div>`;
  const nm = document.getElementById("nm");
  nm.focus();
  nm.addEventListener("keydown", e => { if (e.key === "Enter") join(); });
}

async function join() {
  const name = document.getElementById("nm").value.trim();
  if (!name) return;
  me = await api("/api/actor", { method:"POST", body: JSON.stringify({ name }) });
  render(); loadBridges();
}

function render() {
  document.getElementById("app").outerHTML = `
    <div id="side">
      <h1>Puente · ${me.name}</h1>
      <div id="bridges"></div>
      <button onclick="newBridge()">Nuevo puente</button>
    </div>
    <div id="main">
      <div id="drop">Suelta el archivo aquí</div>
      <div id="head">Elige un puente</div>
      <div id="log"></div>
      <div id="prog"></div>
      <div id="err" class="err"></div>
      <div id="bar">
        <button id="clip" onclick="document.getElementById('pick').click()"
                title="Adjuntar">+</button>
        <input type="file" id="pick" style="display:none" onchange="pickFile(this)">
        <input id="input" placeholder="Escribe un mensaje" disabled>
      </div>
    </div>`;

  document.getElementById("input").addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.value.trim()) {
      send(e.target.value.trim()); e.target.value = "";
    }
  });

  const main = document.getElementById("main"), drop = document.getElementById("drop");
  main.addEventListener("dragover", e => { e.preventDefault(); if (current) drop.classList.add("on"); });
  main.addEventListener("dragleave", e => { if (e.target === main) drop.classList.remove("on"); });
  main.addEventListener("drop", e => {
    e.preventDefault(); drop.classList.remove("on");
    if (current && e.dataTransfer.files.length) upload(e.dataTransfer.files[0]);
  });

  document.addEventListener("paste", e => {
    if (!current) return;
    const f = [...e.clipboardData.items].find(i => i.kind === "file");
    if (f) { e.preventDefault(); upload(f.getAsFile()); }
  });
}

async function loadBridges() {
  const list = await api("/api/bridges");
  document.getElementById("bridges").innerHTML = list.map(b =>
    `<div class="bridge ${b.id===current?"active":""}"
          onclick="open_('${b.id}', this.textContent)">${b.name}</div>`).join("");
}

async function newBridge() {
  const name = prompt("Nombre del puente (vacío = automático)");
  if (name === null) return;
  await api("/api/bridges", { method:"POST",
    body: JSON.stringify({ name: name.trim() || null }) });
  loadBridges();
}

async function open_(id, name) {
  current = id;
  document.getElementById("head").textContent = name;
  document.getElementById("input").disabled = false;
  loadBridges();
  const msgs = await api(`/api/bridges/${id}/messages`);
  document.getElementById("log").innerHTML = "";
  msgs.forEach(paint);
  connect(id);
}

function paint(m) {
  const log = document.getElementById("log");
  const hora = new Date(m.created_at).toLocaleTimeString("es-CL",
    { hour:"2-digit", minute:"2-digit" });
  const div = document.createElement("div");
  div.className = "msg" + (m.actor_id === me.id ? " mine" : "");
  div.innerHTML = `<div class="meta">${m.actor_name} · ${hora}</div>
                   <div class="body"></div>`;
  const body = div.querySelector(".body");

  if (m.kind === "file") {
    const a = document.createElement("a");
    a.className = "file";
    a.href = `/api/blob/${m.blob_hash}`;
    a.setAttribute("download", "");
    const nm = document.createElement("span");
    nm.className = "nm"; nm.textContent = m.filename;
    const sz = document.createElement("span");
    sz.className = "sz"; sz.textContent = human(m.size);
    a.append("⭳ ", nm, sz);
    body.appendChild(a);
  } else {
    body.textContent = m.body;
  }

  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function connect(id) {
  if (ws) ws.close();
  ws = new WebSocket(`ws://${location.host}/api/bridges/${id}/ws`);
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.actor_id !== me.id) paint(m);
  };
}

async function send(body) {
  paint(await api(`/api/bridges/${current}/messages`,
    { method:"POST", body: JSON.stringify({ body }) }));
}

function pickFile(el) {
  if (el.files.length) upload(el.files[0]);
  el.value = "";
}

function upload(file) {
  const err = document.getElementById("err");
  err.textContent = "";

  if (file.size > LIMIT) {
    err.textContent = `"${file.name}" pesa ${human(file.size)}. `
      + `El máximo es ${human(LIMIT)}.`;
    return;
  }

  const fd = new FormData();
  fd.append("file", file);
  const xhr = new XMLHttpRequest();
  const prog = document.getElementById("prog");

  xhr.upload.onprogress = e => {
    if (e.lengthComputable) prog.style.width = (e.loaded / e.total * 100) + "%";
  };
  xhr.onload = () => {
    prog.style.width = "0";
    if (xhr.status === 200) paint(JSON.parse(xhr.responseText));
    else err.textContent = "Error al subir: " + xhr.status;
  };
  xhr.onerror = () => { prog.style.width = "0"; err.textContent = "Error de red"; };

  xhr.open("POST", `/api/bridges/${current}/files`);
  xhr.send(fd);
}

boot();
</script>
</body>
</html>
